function invOptions(pid,sel){if(!pid)return '<option value="">— Chọn NCC trước —</option>';const pt=pById(pid);
  const open=allocate(pid).inv.filter(i=>i.open>0);
  return `<option value="">— Trừ vào hóa đơn cũ nhất —</option>`+open.map(i=>`<option value="${i.e.id}" data-open="${i.open}" ${sel===i.e.id?'selected':''}>${esc(i.e.docNo)} · còn ${money(i.open,pt.currency)}${i.days>0?' · quá hạn':''}</option>`).join('');}

/* ---------- hành động ---------- */
const P=id=>S.proposals.find(x=>x.id===id);
const A={
  go:d=>{if(d.status!==undefined){ui.f={type:'',status:d.status,q:''};ui.page=1;}if(d.tab)ui.debtTab=d.tab;if(d.pf){ui.pf=d.pf;ui.pmode='list';}go(d.v,d.name||d.id||null);},
  menu:()=>$('#side').classList.toggle('open'),
  open:d=>go('detail',d.id),
  partner:d=>go('partner',d.id),
  page:d=>{ui.page+=Number(d.d);render();},
  dtab:d=>{ui.debtTab=d.t;render();},
  new:d=>openProposal(d.type||'VT',null,{pid:d.pid}),
  partnerGo:d=>go('partner',d.id),
  ftype:d=>MODAL&&MODAL.switchType&&MODAL.switchType(d.t),
  edit:d=>openProposal(null,P(d.id)),
  addLine:()=>$('#lines').insertAdjacentHTML('beforeend',lineRow({ten:'',quycach:'',sl:'',dvt:''})),
  delLine:(d,el)=>{if($$('#lines .line-row').length>1)el.closest('.line-row').remove();},
  close:()=>closeModal(),
  bgclose:(d,el,e)=>{if(e.target===el)closeModal();},
  submit:d=>{const p=P(d.id);if(!can.submit(p))return;doSubmit(p);save();render();toast(`Đã gửi duyệt ${p.code}`);},
  approve:d=>{const p=P(d.id);askReason(`Duyệt ${p.code}`,'Ý kiến (không bắt buộc)',false,note=>{
      if(!can.approve(p))return;const st=p.steps[p.curStep];st.status='duyet';st.by=S.role;st.at=nowISO();st.note=note;
      hist(p,`Duyệt (${STEP_LABEL[st.role]})`,note);log('Duyệt',p.code);p.curStep++;if(p.curStep>=p.steps.length)p.status='duyet';
      save();closeModal();render();toast(p.status==='duyet'?`${p.code} đã duyệt xong`:`Đã duyệt, chuyển ${STEP_LABEL[p.steps[p.curStep].role]}`);},'Duyệt');},
  reject:d=>{const p=P(d.id);askReason(`Từ chối ${p.code}`,'Lý do từ chối',true,note=>{
      const st=p.steps[p.curStep];st.status='tuchoi';st.by=S.role;st.at=nowISO();st.note=note;p.status='tuchoi';
      hist(p,`Từ chối (${STEP_LABEL[st.role]})`,note);log('Từ chối',p.code);save();closeModal();render();toast('Đã từ chối');},'Từ chối',true);},
  return:d=>{const p=P(d.id);askReason(`Trả lại ${p.code}`,'Cần bổ sung / sửa gì',true,note=>{
      const st=p.steps[p.curStep];st.status='tralai';st.by=S.role;st.at=nowISO();st.note=note;p.status='nhap';p.returned=`${note} — ${uname(S.role)}`;
      hist(p,`Trả lại (${STEP_LABEL[st.role]})`,note);log('Trả lại',p.code);save();closeModal();render();toast('Đã trả lại người đề xuất');},'Trả lại');},
  delProp:d=>{const p=P(d.id);if(!can.del(p))return;confirmDel('Xóa đề xuất',`Xóa <b>${esc(p.code)}</b> – ${esc(p.title)}? Đề xuất chưa được duyệt nên xóa hẳn; thao tác được ghi vào nhật ký.`,()=>{S.proposals.splice(S.proposals.indexOf(p),1);log('Xóa đề xuất',p.code);ui.view='proposals';ui.id=null;toast('Đã xóa '+p.code);});},
  cancel:d=>{const p=P(d.id);if(!can.cancel(p))return;askReason(`Hủy ${p.code}`,'Lý do hủy',true,r=>{
      p.cancel={by:S.role,at:nowISO(),reason:r,prev:p.status};p.status='huy';hist(p,'Hủy đề xuất',r);log('Hủy (xóa mềm)',p.code);save();closeModal();render();toast('Đã hủy. Dữ liệu vẫn được lưu.');},'Hủy đề xuất',true);},
  restore:d=>{const p=P(d.id);if(!can.restore(p))return;p.status=p.cancel.prev;hist(p,'Khôi phục',`Khôi phục về trạng thái ${STATUS[p.status]}`);log('Khôi phục',p.code);p.cancel=null;save();render();toast('Đã khôi phục');},
  pay:d=>{const p=P(d.id);const f=p.fields;const pt=f.partnerId&&S.partners.find(x=>x.id===f.partnerId);
    openModal(p.type==='TU'?'Chi tạm ứng':'Lập phiếu chi',`<dl class="dl"><dt>Đề xuất</dt><dd>${esc(p.code)} · ${esc(p.title)}</dd><dt>Số tiền chi</dt><dd><b class="num">${money(f.amount,f.currency)}</b></dd>
      <dt>Người nhận</dt><dd>${pt?esc(pt.name):esc(p.type==='TU'?uname(p.createdBy):f.partnerText)}</dd>${pt?`<dt>Công nợ</dt><dd>Ghi giảm phải trả ${esc(pt.code)}</dd>`:''}</dl>
      <div class="f"><label for="payDate">Ngày chi <span class="req">*</span></label><input id="payDate" name="payDate" type="date" value="${today()}"></div>`,
      `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn pri">Xác nhận chi</button>`,
      fd=>{if(!can.pay(p))return true;const dt=fd.get('payDate');if(!dt){fieldErr('payDate','Chọn ngày chi.');return false;}
        p.payCode=nextCode('PC');
        if(p.type==='TT'){p.status='hoanthanh';if(pt)S.ledger.push({id:uid(),partnerId:pt.id,kind:'thanhtoan',date:dt,due:'',docNo:p.payCode,desc:p.title,amount:f.amount,rate:f.rate||1,method:'Chuyển khoản',alloc:f.invId?[{invId:f.invId,amount:f.amount}]:[],ref:p.code,cancelled:null,by:S.role,at:nowISO()});}
        else p.status='dachi';
        hist(p,`${p.type==='TU'?'Chi tạm ứng':'Lập phiếu chi'} (${p.payCode})`,'');log('Lập phiếu chi',`${p.payCode} ← ${p.code}`);save();closeModal();render();toast(`Đã lập ${p.payCode}`);return true;});},
  settle:d=>{const p=P(d.id);openModal(`Quyết toán ${p.code}`,`<div class="sub">Đã tạm ứng: <b>${money(p.fields.amount)}</b></div>
      <div class="f"><label for="used">Số tiền đã chi có chứng từ <span class="req">*</span></label><input id="used" name="used" type="number" min="0" step="any"></div>
      <div class="f"><label for="snote">Ghi chú</label><input id="snote" name="snote"></div>`,
      `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn pri">Quyết toán</button>`,
      fd=>{const used=Number(fd.get('used'));if(!(used>=0)||fd.get('used')===''){fieldErr('used','Nhập số tiền.');return false;}
        if(used>p.fields.amount){fieldErr('used','Lớn hơn số tạm ứng: lập đề xuất thanh toán phần chênh lệch.');return false;}
        p.settle={used,refund:p.fields.amount-used,at:nowISO()};p.status='hoanthanh';
        hist(p,'Quyết toán tạm ứng',`Dùng ${money(used)}, hoàn lại ${money(p.settle.refund)}. ${fd.get('snote')||''}`);log('Quyết toán tạm ứng',p.code);save();closeModal();render();toast('Đã quyết toán');return true;});},
  fulfill:d=>{const p=P(d.id);askReason(`Hoàn thành ${p.code}`,'Ghi chú cấp / mua',false,n=>{p.status='hoanthanh';hist(p,'Hoàn thành – đã cấp/mua',n);log('Hoàn thành đề xuất vật tư',p.code);save();closeModal();render();toast('Đã hoàn thành');},'Xác nhận');},
  newEntry:d=>d.kind==='phatsinh'?openInvoice(d.pid):openPay(d.pid),
  newInv:d=>{if(can.ledger())openInvoice(d.pid);},
  newPay:d=>{if(can.ledger())openPay(d.pid,d.inv);},
  editPartner:d=>{if(can.ledger())editPartner(d.id);},
  payProp:d=>{const p=pById(d.pid);let amt='',title='';if(d.inv){const i=allocate(p.id).inv.find(x=>x.e.id===d.inv);if(i){amt=i.open;title=`Thanh toán ${i.e.docNo} – ${p.name}`;}}
    openProposal('TT',null,{pid:p.id,inv:d.inv||'',amt,title});},
  dview:d=>{ui.dview=d.v;if(d.f)ui.dinv=d.f;render();},
  dover:()=>{ui.dover=!ui.dover;render();},
  dinv:d=>{ui.dinv=d.f;render();},
  ptab:d=>{ui.ptab=d.t;render();},
  autoAlloc:()=>{let amt=Number($('#pamt').value)||0;const ins=$$('#pallocs [data-al]');
    if(!amt){amt=ins.reduce((t,x)=>t+Number(x.dataset.open),0);$('#pamt').value=r2(amt);}
    ins.forEach(x=>{const o=Number(x.dataset.open);const take=r2(Math.min(o,amt));x.value=take>0?take:'';amt=r2(amt-take);});syncPayForm(false);},
  reconCopy:()=>{const t=$('#reconDoc').innerText;const done=()=>toast('Đã sao chép biên bản');
    try{navigator.clipboard.writeText(t).then(done,()=>{const r=document.createRange();r.selectNodeContents($('#reconDoc'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Đã chọn nội dung, bấm Ctrl+C để sao chép');});}catch(e){toast('Hãy bôi đen và sao chép thủ công');}},
  reconSave:()=>{const p=pById(ui.id);openModal('Ghi nhận kết quả đối chiếu',`<div class="sub">Kỳ ${fDate(ui.rfrom)} – ${fDate(ui.rto)} · ${esc(p.name)}</div>
      <div class="f"><label for="rres">Kết quả</label><select id="rres" name="ok"><option value="1">Hai bên khớp số</option><option value="0">Có chênh lệch</option></select></div>
      <div class="f"><label for="rnote">Ghi chú (bắt buộc nếu lệch)</label><input id="rnote" name="note"></div>`,null,
    fd=>{const ok=fd.get('ok')==='1',note=(fd.get('note')||'').trim();if(!ok&&!note){fieldErr('note','Ghi rõ khoản chênh lệch.');return false;}
      (p.recons||(p.recons=[])).push({from:ui.rfrom,to:ui.rto,ok,note,by:S.role,at:nowISO()});log('Đối chiếu công nợ',`${p.code} đến ${ui.rto}: ${ok?'khớp':'lệch'}`);save();closeModal();render();toast('Đã ghi nhận');return true;});},
  openRef:d=>{const p=S.proposals.find(x=>x.code===d.code);if(p)go('detail',p.id);},
  cancelEntry:d=>{const e=S.ledger.find(x=>x.id===d.id);
    if(e.kind==='phatsinh'){const i=allocate(e.partnerId).inv.find(x=>x.e.id===e.id);if(i&&i.paid>0){toast('Hóa đơn đã có thanh toán: hủy phiếu thu/chi liên quan trước.');return;}}
    askReason('Hủy bút toán công nợ','Lý do hủy',true,r=>{e.cancelled={by:S.role,at:nowISO(),reason:r};log('Hủy bút toán công nợ',e.docNo);save();closeModal();render();toast('Đã hủy bút toán');},'Hủy bút toán',true);},
  newPartner:()=>editPartner(null),
  newPartnerOld:()=>{const kind=ui.debtTab;openModal(kind==='ncc'?'Thêm nhà cung cấp':'Thêm khách hàng',`<div class="fgrid">
      <div class="f full"><label for="pname">Tên <span class="req">*</span></label><input id="pname" name="pname"></div>
      <div class="f"><label for="pcur">Tiền tệ công nợ</label><select id="pcur" name="pcur"><option>VND</option><option>USD</option></select></div></div>`,null,
      fd=>{const n=(fd.get('pname')||'').trim();if(!n){fieldErr('pname','Nhập tên.');return false;}
        const pre=kind==='ncc'?'NCC':'KH';const num=S.partners.filter(x=>x.kind===kind).length+1;
        const pt={id:uid(),code:`${pre}-${String(num).padStart(3,'0')}`,name:n,kind,currency:fd.get('pcur')};S.partners.push(pt);log('Thêm đối tượng công nợ',pt.code);save();closeModal();render();toast('Đã thêm');return true;});},
  saveThr:()=>{const v=Number($('#thr').value);if(!(v>=0)){toast('Ngưỡng không hợp lệ');return;}S.threshold=v;log('Đổi ngưỡng duyệt Giám đốc',money(v));save();render();toast('Đã lưu cấu hình');},
  reset:()=>askReason('Khôi phục dữ liệu mẫu','Gõ lý do (dữ liệu thử hiện tại sẽ bị thay bằng dữ liệu mẫu)',true,()=>{S=seed();S.role='admin';save();closeModal();renderRoleSel();go('dash');toast('Đã khôi phục dữ liệu mẫu');},'Khôi phục',true),
  export:()=>toast('Xuất Excel có ở bản thật; bản thử trong trình duyệt không tải file được.'),
  /* sản xuất */
  pmode:d=>{ui.pmode=d.m;render();},
  pf:d=>{ui.pf=d.f;render();},
  otab:d=>{ui.otab=d.t;render();},
  ktab:d=>{ui.ktab=d.t;render();},
  newOrder:()=>{if(can.createOrder())openOrderForm();},
  addMat:()=>$('#mats').insertAdjacentHTML('beforeend',matRow(null)),
  delMat:(d,el)=>{if($$('#mats .mat-row').length>1)el.closest('.mat-row').remove();},
  issue:d=>{const o=orderById(d.id);if(!can.stock()||o.status!=='chovattu')return;const rest=toIssue(o);
    openModal(`Xuất vật tư · ${o.code}`,`<div class="tbl-wrap"><table><thead><tr><th>Vật tư</th><th>Từ kho</th><th class="r">Xuất</th><th class="r">Tồn trước</th><th class="r">Tồn sau</th></tr></thead><tbody>
      ${rest.map(m=>{const i=itemById(m.itemId),h=onHand(i.wh,i.id);return `<tr><td>${esc(i.name)}</td><td>${esc(whName(i.wh))}</td><td class="r num">${nf(m.qty)} ${esc(i.unit)}</td><td class="r num">${nf(h)}</td><td class="r num ${h<m.qty?'badc':''}">${nf(r3(h-m.qty))}</td></tr>`;}).join('')}</tbody></table></div>
      <div class="sub">Hệ thống lập phiếu chuyển kho sang Kho Sản xuất (mỗi kho gửi một phiếu). Quản đốc xác nhận nhận đủ thì ${o.qty} tấm mới vào công đoạn Chuyền và lệnh chuyển sang Đang sản xuất.</div>`,
      `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn pri">Lập phiếu & xuất hàng</button>`,
      ()=>{const err=issueOrder(o);if(err){toast(err);return false;}log('Xuất vật tư theo lệnh',o.code);save();closeModal();render();toast('Đã lập phiếu chuyển kho – chờ Quản đốc xác nhận nhận');return true;});},
  receive:d=>{const o=orderById(d.id);if(!can.stock()||o.status!=='chonhap')return;
    openModal(`Nhập kho thành phẩm · ${o.code}`,`<dl class="dl"><dt>Thành phẩm</dt><dd>${esc(spec(o))}</dd><dt>Số tấm đạt</dt><dd><b class="num">${o.st[4].done}</b> tấm</dd><dt>Tổng lỗi cả lệnh</dt><dd class="num">${totalNg(o)} tấm (đã vào Kho Phế)</dd><dt>Tiêu hao vật tư</dt><dd>Tự ghi phiếu xuất dùng theo số vật tư đã chuyển xưởng cho lệnh</dd><dt>Đối chiếu</dt><dd>${o.qty} = ${o.st[4].done} + ${totalNg(o)} ${o.qty===o.st[4].done+totalNg(o)?'<span class="okc">khớp ✓</span>':'<span class="badc">lệch</span>'}</dd></dl>`,
      `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn pri">Nhập kho</button>`,
      ()=>{receiveFG(o);log('Nhập kho thành phẩm',o.code);save();closeModal();render();toast('Đã nhập kho thành phẩm, lệnh hoàn thành');return true;});},
  cancelOrder:d=>{const o=orderById(d.id);askReason(`Hủy ${o.code}`,'Lý do hủy lệnh',true,r=>{o.cancel={by:S.role,at:nowISO(),reason:r,prev:o.status};o.status='huy';hlog(o,'Hủy lệnh',r);log('Hủy lệnh sản xuất',o.code);save();closeModal();render();toast('Đã hủy lệnh (vẫn lưu dữ liệu)');},'Hủy lệnh',true);},
  restoreOrder:d=>{const o=orderById(d.id);o.status=o.cancel.prev;hlog(o,'Khôi phục lệnh','');log('Khôi phục lệnh sản xuất',o.code);o.cancel=null;save();render();toast('Đã khôi phục');},
  report:d=>{const o=orderById(d.id);if(can.report(o))openReport(o);},
  tem:d=>showTem(orderById(d.id)),
  approveRep:d=>{const r=S.prod.reports.find(x=>x.id===d.id);if(!can.review()||r.status!=='cho')return;
    if(isLocked(monthOf(r.date))){toast('Tháng của phiếu này đã chốt kỳ.');return;}
    approveReport(r);log('Duyệt sản lượng',r.code);save();render();toast(`Đã duyệt ${r.code}`);},
  returnRep:d=>{const r=S.prod.reports.find(x=>x.id===d.id);askReason(`Trả lại ${r.code}`,'Lý do trả lại (tổ sẽ báo lại)',true,n=>{r.status='tralai';r.note=n;r.reviewBy=S.role;r.reviewAt=nowISO();
    hlog(orderById(r.orderId),`Trả lại phiếu ${r.code}`,n);log('Trả lại phiếu sản lượng',r.code);save();closeModal();render();toast('Đã trả lại phiếu');},'Trả lại');},
  approveAll:()=>{if(!can.review())return;const rs=S.prod.reports.filter(r=>r.status==='cho'&&!isLocked(monthOf(r.date))).sort((a,b)=>a.at.localeCompare(b.at));
    rs.forEach(r=>{approveReport(r);log('Duyệt sản lượng',r.code);});save();render();toast(`Đã duyệt ${rs.length} phiếu`);},
  scanPick:d=>{const o=orderById(d.id);go('order',o.id);if(can.report(o))openReport(o);},
  lockMonth:()=>{const m=ui.month;askReason(`Chốt kỳ lương khoán ${m.slice(5)}/${m.slice(0,4)}`,'Ghi chú chốt kỳ',false,()=>{if(!isLocked(m))S.prod.locked.push(m);log('Chốt kỳ lương khoán',m);save();closeModal();render();toast('Đã chốt kỳ');},'Chốt kỳ');},
  /* nhân sự, báo cáo, quản trị */
  design:d=>openModal('Chức năng này sẽ làm ở bước chi tiết',`<p style="margin:0">${esc(d.msg||'')}</p><p class="sub" style="margin:0">Đây là màn hình thiết kế để anh/chị xem bố cục. Chức năng thật sẽ hoàn thiện khi làm chi tiết module này.</p>`,`<button type="button" class="btn pri" data-act="close">Đã hiểu</button>`,()=>true),
  notif:()=>{const N=notifications();openModal(`Thông báo (${N.length})`,N.length?`<div class="inline-list" style="margin:-18px">${N.map(n=>`<div class="it"><div><b>${esc(n.t)}</b><div class="sub">${esc(n.s)}</div></div><button type="button" class="btn sm" data-act="notifGo" data-v="${n.v}" data-id="${n.id||''}">Mở</button></div>`).join('')}</div>`:'<div class="empty">Không có thông báo.</div>',
    `<button type="button" class="btn" data-act="close">Đóng</button>`,()=>true);},
  notifGo:d=>{closeModal();go(d.v,d.id||null);},
  emp:d=>showEmp(empById(d.id)),
  newEmp:()=>openModal('Thêm nhân viên',`<div class="fgrid"><div class="f"><label for="nename">Họ tên <span class="req">*</span></label><input id="nename" name="name"></div>
      <div class="f"><label for="nedept">Phòng ban <span class="req">*</span></label><select id="nedept" name="dept">${[...new Set(S.hr.emps.map(e=>e.dept))].map(d=>`<option>${esc(d)}</option>`).join('')}</select></div>
      <div class="f"><label for="netitle">Chức vụ <span class="req">*</span></label><input id="netitle" name="title"></div><div class="f"><label for="nestart">Ngày vào làm <span class="req">*</span></label><input id="nestart" name="start" type="date" value="${today()}"></div>
      <div class="f"><label for="nect">Loại hợp đồng</label><select id="nect" name="ctype"><option>Thử việc</option><option>12 tháng</option><option>36 tháng</option><option>Không thời hạn</option></select></div>
      <div class="f"><label for="nebase">Lương cơ bản</label><input id="nebase" name="base" type="number" min="0" step="100000"></div></div>`,null,
    fd=>{clearErr();const n=(fd.get('name')||'').trim(),ti=(fd.get('title')||'').trim();let ok=true;if(!n){fieldErr('name','Nhập họ tên.');ok=false;}if(!ti){fieldErr('title','Nhập chức vụ.');ok=false;}if(!ok)return false;

/* ================= KHO: danh mục 3 cấp, 6 kho, phiếu xuất nhập ================= */
var _stk=null;
const r3=n=>Math.round(Number(n)*1000)/1000;
const WH=[{k:'NL',name:'Kho Nguyên liệu'},{k:'TH',name:'Kho Tiêu hao'},{k:'SX',name:'Kho Sản xuất'},{k:'TP',name:'Kho Thành phẩm'},{k:'PHE',name:'Kho Phế'},{k:'KT',name:'Kho Kế toán',virtual:true}];
const REALWH=WH.filter(w=>!w.virtual);
const whName=k=>(WH.find(w=>w.k===k)||{}).name||k;
const isRealWh=k=>REALWH.some(w=>w.k===k);
const VT={
  NM:{name:'Nhập mua từ NCC',pre:'NM',desc:'Hàng nhà cung cấp giao vào Kho Nguyên liệu hoặc Kho Tiêu hao. Cộng tồn ngay khi lưu.'},
  CK:{name:'Chuyển kho',pre:'CK',desc:'Kho Nguyên liệu / Tiêu hao chuyển sang Kho Sản xuất, hoặc Kho Sản xuất trả hàng thừa về. Kho gửi bị trừ ngay, kho nhận chỉ được cộng khi người nhận xác nhận.'},
  XD:{name:'Xuất dùng cho sản xuất',pre:'XD',desc:'Kho Sản xuất ghi nhận vật tư, tiêu hao đã dùng hết (ra khỏi kho).'},
  NSX:{name:'Nhập từ sản xuất',pre:'NS',desc:'Hệ thống tự tạo: tấm lỗi vào Kho Phế khi Quản đốc duyệt sản lượng, thành phẩm vào Kho Thành phẩm khi nhập kho.'},
  XB:{name:'Xuất bán',pre:'XB',desc:'Bán thành phẩm (Kho Thành phẩm) hoặc bán phế (Kho Phế) cho khách hàng.'},
  TRA:{name:'Trả nhà cung cấp',pre:'TR',desc:'Trả hàng lỗi, không đạt từ Kho Nguyên liệu / Tiêu hao về nhà cung cấp.'},
  KK:{name:'Kiểm kê',pre:'KK',desc:'Nhập số đếm thực tế. Khi Kế toán trưởng duyệt: phần thiếu chuyển sang Kho Kế toán, phần thừa lấy từ Kho Kế toán.'}};
const PRICED=['NM','XB','TRA'];
const VST={gui:['Chờ kho nhận','st-cho'],cho:['Chờ duyệt','st-cho'],ghiso:['Đã ghi sổ','st-hoanthanh'],tuchoi:['Bị từ chối','st-tuchoi'],huy:['Đã hủy','st-huy']};
const vpill=s=>`<span class="pill ${VST[s][1]}">${VST[s][0]}</span>`;
const catById=id=>S.inv.cats.find(c=>c.id===id);
const catRoot=id=>{const c=catById(id);return c&&c.parent?catById(c.parent):c;};
const catChain=id=>{const c=catById(id);if(!c)return [];return c.parent?[catById(c.parent),c]:[c];};
const catPath=id=>catChain(id).map(c=>c.name).join(' › ');
const itemsIn=cid=>S.inv.items.filter(i=>i.catId===cid||(catById(i.catId)||{}).parent===cid);
const attrText=i=>catChain(i.catId).flatMap(c=>c.fields||[]).filter(f=>i.attrs&&i.attrs[f.k]!==undefined&&i.attrs[f.k]!=='').map(f=>`${f.label}: ${i.attrs[f.k]}`).join(' · ');

/* tồn kho = cộng dồn hiệu ứng của các phiếu */
function vEffects(v){const E=[];if(v.status!=='ghiso'&&v.status!=='gui')return E;
  if(v.type==='KK'){v.lines.forEach(l=>{const d=r3(l.real-l.book);if(d){E.push({wh:v.from,itemId:l.itemId,q:d});E.push({wh:'KT',itemId:l.itemId,q:-d});}});return E;}
  v.lines.forEach(l=>{if(isRealWh(v.from))E.push({wh:v.from,itemId:l.itemId,q:-l.qty});if(isRealWh(v.to)&&v.status==='ghiso')E.push({wh:v.to,itemId:l.itemId,q:l.qty});});
  return E;}
function stockMap(){if(_stk)return _stk;const M={};S.inv.vouchers.forEach(v=>vEffects(v).forEach(e=>{const k=e.wh+'|'+e.itemId;M[k]=r3((M[k]||0)+e.q);}));return _stk=M;}
const onHand=(wh,id)=>stockMap()[wh+'|'+id]||0;
const totalHand=id=>r3(REALWH.reduce((t,w)=>t+onHand(w.k,id),0));
const isLow=i=>i.active!==false&&i.min>0&&onHand(i.wh,i.id)<i.min;
const lowItems=()=>S.inv.items.filter(isLow);
const vById=id=>S.inv.vouchers.find(v=>v.id===id);
function newV(type,d,by){
  const v=Object.assign({id:uid(),code:nextCode(VT[type].pre),type,date:today(),from:'',to:'',partnerId:'',orderId:'',ref:'',lines:[],note:'',status:'ghiso',by:by||S.role,at:nowISO(),recv:null,appr:null,cancel:null,hist:[]},d);
  v.hist.push({at:v.at,by:v.by,action:'Lập phiếu',note:''});S.inv.vouchers.push(v);_stk=null;return v;}
function vlog(v,action,note,by){v.hist.push({at:nowISO(),by:by||S.role,action,note:note||''});_stk=null;}
function shortage(wh,lines){const need={};lines.forEach(l=>need[l.itemId]=r3((need[l.itemId]||0)+l.qty));
  for(const [id,q] of Object.entries(need)){const h=onHand(wh,id);if(h<q){const i=itemById(id);return `${i?i.name:'Mặt hàng'}: ${whName(wh)} còn ${nf(h)} ${i?i.unit:''}, cần ${nf(q)}.`;}}return '';}
function vEndT(v,side){const k=side==='from'?v.from:v.to;
  if(k==='NCC'||k==='KH'){const p=pById(v.partnerId);return p?p.name:(k==='NCC'?'Nhà cung cấp':'Khách hàng');}
  if(k==='DUNG')return 'Dùng cho sản xuất';if(k==='SXOUT')return 'Sản xuất';return whName(k);}
const vEnd=(v,side)=>esc(vEndT(v,side));
const vRoute=v=>v.type==='KK'?`${esc(whName(v.from))} ⇄ Kho Kế toán`:`${vEnd(v,'from')} → ${vEnd(v,'to')}`;
const vSum=v=>{const l=v.lines[0];if(!l)return '';const i=itemById(l.itemId)||{};const q=v.type==='KK'?`đếm ${nf(l.real)}`:nf(l.qty);return `${esc(i.name)} · ${q} ${esc(i.unit||'')}${v.lines.length>1?` <span class="sub">+${v.lines.length-1} mặt hàng</span>`:''}`;};

/* quyền kho */
const vCan={
  create:t=>({NM:['tk','admin'],TRA:['tk','admin'],XB:['tk','admin'],CK:['tk','qd','admin'],XD:['qd','admin'],KK:['tk','admin']}[t]||[]).includes(S.role),
  ckFrom:()=>S.role==='admin'?['NL','TH','SX']:S.role==='tk'?['NL','TH']:S.role==='qd'?['SX']:[],
  recv:v=>v.status==='gui'&&(S.role==='admin'||(v.to==='SX'?S.role==='qd':S.role==='tk')),
  appr:v=>v.type==='KK'&&v.status==='cho'&&isRole('ktt','admin')&&v.by!==S.role,
  cancel:v=>((v.status==='gui'||v.status==='cho')&&(v.by===S.role||S.role==='admin'))||(v.status==='ghiso'&&v.type!=='NSX'&&isRole('ktt','admin')),
  cat:()=>isRole('tk','ktt','admin')};
const vNeedMe=()=>S.inv.vouchers.filter(v=>vCan.recv(v)||vCan.appr(v));

/* nối với sản xuất */
const orderCK=o=>S.inv.vouchers.filter(v=>v.type==='CK'&&v.orderId===o.id&&(v.status==='gui'||v.status==='ghiso'));
const sentQty=(o,itemId)=>r3(orderCK(o).filter(v=>v.to==='SX').reduce((t,v)=>t+v.lines.filter(l=>l.itemId===itemId).reduce((a,l)=>a+l.qty,0),0));
const toIssue=o=>o.mats.map(m=>({itemId:m.itemId,qty:r3(m.qty-sentQty(o,m.itemId))})).filter(m=>m.qty>0);
function issueOrder(o,by,date){
  const rest=toIssue(o);if(!rest.length)return 'Đã xuất đủ vật tư cho lệnh này.';
  const G={};rest.forEach(m=>{const it=itemById(m.itemId);(G[it.wh]=G[it.wh]||[]).push(m);});
  for(const [wh,ls] of Object.entries(G)){const e=shortage(wh,ls);if(e)return 'Không đủ tồn – '+e;}
  const codes=Object.entries(G).map(([wh,ls])=>newV('CK',{date:date||today(),from:wh,to:'SX',orderId:o.id,status:'gui',lines:ls.map(l=>({itemId:l.itemId,qty:l.qty})),note:'Xuất vật tư theo lệnh '+o.code},by).code);
  o.issued={at:nowISO(),by:by||S.role,codes:((o.issued&&o.issued.codes)||[]).concat(codes)};
  hlog(o,'Kho xuất vật tư – chờ xưởng xác nhận nhận',codes.join(', '),by);return '';}
function recvV(v,by){
  v.status='ghiso';v.recv={by:by||S.role,at:nowISO()};vlog(v,'Xác nhận đã nhận đủ hàng','',by);
  const o=v.orderId&&orderById(v.orderId);
  if(o&&o.status==='chovattu'&&v.to==='SX'&&!toIssue(o).length&&orderCK(o).every(x=>x.status==='ghiso')){
    o.st[0].recv=o.qty;o.status='dangsx';hlog(o,'Xưởng nhận đủ vật tư – bắt đầu sản xuất',orderCK(o).map(x=>x.code).join(', '),by);}}
function netToSX(o,itemId){return r3(S.inv.vouchers.filter(v=>v.orderId===o.id&&v.status==='ghiso'&&(v.type==='CK'||v.type==='XD')).reduce((t,v)=>t+v.lines.filter(l=>l.itemId===itemId).reduce((a,l)=>a+(v.to==='SX'?l.qty:v.from==='SX'?-l.qty:0),0),0));}
function tpItem(o){const code=`TP-${o.product.toUpperCase()}-${o.T}x${o.W}x${o.L}`;let it=S.inv.items.find(i=>i.code===code);
  if(!it){it={id:uid(),code,name:`${o.product} ${o.T}×${o.W}×${o.L} mm`,catId:'c-TP',unit:'Tấm',wh:'TP',min:0,active:true,attrs:{dai:o.L,rong:o.W,cao:o.T}};S.inv.items.push(it);}return it;}
function receiveFG(o,by,date){
  const it=tpItem(o);const q=o.st[STAGES.length-1].done;const d=date||today();
  const m=newV('NSX',{date:d,from:'SXOUT',to:'TP',orderId:o.id,lines:[{itemId:it.id,qty:q}],note:'Thành phẩm đạt của lệnh '+o.code},by);
  const used=[];o.mats.forEach(mt=>{const q2=Math.min(netToSX(o,mt.itemId),onHand('SX',mt.itemId));if(q2>0)used.push({itemId:mt.itemId,qty:r3(q2)});});
  const xd=used.length?newV('XD',{date:d,from:'SX',to:'DUNG',orderId:o.id,lines:used,note:'Tự động: vật tư đã dùng cho lệnh '+o.code},by):null;
  o.status='hoanthanh';o.received={at:nowISO(),by:by||S.role,code:m.code,qty:q};hlog(o,'Nhập kho thành phẩm',`${m.code}: ${q} tấm`+(xd?` · ghi tiêu hao vật tư ${xd.code}`:''),by);}

function catFilterOpts(sel){return `<option value="">Tất cả nhóm</option>`+S.inv.cats.filter(c=>!c.parent).map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${esc(r.name)}</option>`+S.inv.cats.filter(c=>c.parent===r.id).map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>— ${esc(c.name)}</option>`).join('')).join('');}
function nxtRows(wh,m){const start=m+'-01',R={};

const CAPN={0:'Tổng Giám đốc',1:'Giám đốc',2:'Trưởng phòng / Quản lý',3:'Trưởng bộ phận',4:'Trưởng nhóm / Chuyên viên',5:'Nhân viên / Công nhân'};
const orgActive=()=>S.hr.emps.filter(e=>e.status!=='Đã nghỉ việc');
function orgTree(){
  const N=S.org.units.map(u=>Object.assign({},u,{ch:[]}));const by={};N.forEach(n=>by[n.k]=n);
  const root=N.find(n=>n.cap===0)||N[0];
  N.forEach(n=>{if(n===root)return;const p=n.k===n.ph?root:((n.bp&&n.bp!==n.k&&by[n.bp])||by[n.ph]||root);p.ch.push(n);});
  return root;}
const unitName=n=>n.k===n.ph&&n.cap<=2?n.pn:n.n;
function renderOrg(){
  const tab=['pos','unit'].includes(ui.otab)?ui.otab:'tree';const ed=isRole('hc','admin');const E=orgActive();
  const cnt=k=>E.filter(e=>e.grp===k).length;const tot=n=>cnt(n.k)+n.ch.reduce((t,c)=>t+tot(c),0);
  const root=orgTree();const phong=root.ch;
  const lead=n=>{const L=E.filter(e=>e.grp===n.k&&e.cap<=4).sort((a,b)=>a.cap-b.cap);if(!L.length)return '';const c=L[0].cap;const H=L.filter(e=>e.cap===c);

  }else if(tab==='unit'){

        ${ed?`<td class="r nowrap"><button class="btn sm" data-act="unitEdit" data-k="${esc(n.k)}">Sửa</button> <button class="btn sm danger" data-act="unitDel" data-k="${esc(n.k)}">Xóa</button></td>`:''}</tr>`;}).join('')}</tbody></table></div>`;

    const holders=c=>E.filter(e=>e.pos===c).length;const uOf=g=>S.org.units.find(u=>u.k===g)||{};

      ${ed?'<button class="btn pri" data-act="posNew">+ Thêm chức danh</button>':''}</div>
      <div class="tbl-wrap only-desk"><table><thead><tr><th>Mã chức danh</th><th>Chức danh</th><th>Cấp</th><th>Phòng ban</th><th>Nhóm</th><th class="r">Đang giữ</th>${ed?'<th class="r">Thao tác</th>':''}</tr></thead><tbody>
      ${P.map(p=>{const u=uOf(p.g),h=holders(p.c);return `<tr class="click" data-act="orgPos" data-c="${esc(p.c)}"><td class="code">${esc(p.c)}</td><td><b>${esc(p.t)}</b></td><td>${p.cap} <span class="sub">${esc(CAPN[p.cap]||'')}</span></td><td>${esc(u.pn||'')}</td><td>${esc(u.n||'')}</td><td class="r num">${h||'<span class="sub">0</span>'}</td>${ed?`<td class="r nowrap"><button class="btn sm" data-act="posEdit" data-c="${esc(p.c)}">Sửa</button> <button class="btn sm danger" data-act="posDel" data-c="${esc(p.c)}">Xóa</button></td>`:''}</tr>`;}).join('')}</tbody></table></div>
      <div class="mcards">${P.map(p=>{const u=uOf(p.g);return `<button class="mcard" data-act="orgPos" data-c="${esc(p.c)}"><span class="mc-top"><b>${esc(p.t)}</b><b class="num">${holders(p.c)} người</b></span><span class="sub">${esc(p.c)} · cấp ${p.cap}</span><span class="sub">${esc(u.pn||'')} › ${esc(u.n||'')}</span></button>`;}).join('')}</div>
      <div class="pager"><span>${P.length} chức danh</span></div>`;
  }

    <div class="actions">${isRole('hc','admin')?'<button class="btn" data-act="otab" data-t="unit">Sửa sơ đồ</button>':''}<button class="btn" data-act="export">Xuất Excel</button></div></div>

function confirmDel(title,msg,cb){openModal(title,`<p style="margin:0">${msg}</p>`,`<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn danger">Xóa</button>`,()=>{cb();save();closeModal();render();return true;});}
function blocked(title,msg,extra){openModal(title,`<div class="alert warn" style="margin:0">${msg}</div>`,`<button type="button" class="btn" data-act="close">Đóng</button>${extra||''}`,()=>true);}
const posLabel=p=>{const u=S.org.units.find(x=>x.k===p.g)||{};return `${p.t} — ${u.pn||''} › ${u.n||''}`;};
const empLinks=e=>{const L=[];const nt=S.hr.tasks.filter(t=>t.ass===e.id).length;if(nt)L.push(nt+' việc được giao');
  if(Object.keys(S.hr.adj).some(k=>k.startsWith(e.id+'|')))L.push('điều chỉnh chấm công');if(Object.keys(S.hr.bonus).some(k=>k.endsWith('|'+e.id)))L.push('thưởng');
  if(S.hr.decisions.some(d=>d.emp===e.id))L.push('quyết định');return L;};
function openEmpForm(e){const sal=can.viewSalary();

function openUnitForm(u){const isNew=!u;const opts=S.org.units.filter(x=>x.cap<=3||x.k===x.ph);

     :`<div class="f"><label>Mã đơn vị</label><input value="${esc(u.k)}" disabled><span class="hint">Mã đã gắn với nhân viên và chức danh nên không đổi.</span></div>`}
    <div class="f"><label for="uname">Tên <span class="req">*</span></label><input id="uname" name="name" value="${u?esc(u.k===u.ph&&u.cap<=2?u.pn:u.n):''}" placeholder="VD: N. Ép Hùng 2"></div>

    <div class="f"><label for="ukh">Khối</label><select id="ukh" name="kh">${['','Gián tiếp','Trực tiếp'].map(s=>`<option value="${s}" ${u&&u.kh===s?'selected':''}>${s||'—'}</option>`).join('')}</select></div></div>`,null,
    fd=>{clearErr();const name=(fd.get('name')||'').trim();if(!name){fieldErr('name','Nhập tên.');return false;}

        if(!/^[A-ZĐ0-9]+,[A-ZĐ0-9]+,[A-ZĐ0-9]+$/.test(k)){fieldErr('code','Mã dạng XX,YY,ZZ.');return false;}if(S.org.units.some(x=>x.k===k)){fieldErr('code','Mã này đã có.');return false;}

        u.n=ph&&u.n.startsWith('P. ')?u.n:name;if(!ph)S.hr.emps.filter(e=>e.grp===u.k).forEach(e=>e.team=name);u.s=(fd.get('short')||'').trim();u.kh=fd.get('kh');log('Sửa đơn vị',u.k+' '+name);}

  unitNew:()=>openUnitForm(null),
  unitEdit:d=>openUnitForm(S.org.units.find(u=>u.k===d.k)),
  unitDel:d=>{const u=S.org.units.find(x=>x.k===d.k);const ne=S.hr.emps.filter(e=>e.grp===u.k).length,np=S.org.pos.filter(p=>p.g===u.k).length;
    const kids=S.org.units.filter(x=>x!==u&&(x.bp===u.k&&x.k!==u.k||(u.k===u.ph&&x.ph===u.k&&x.k!==u.k))).length;
    const why=[ne&&ne+' nhân viên',np&&np+' chức danh',kids&&kids+' đơn vị con'].filter(Boolean);
    if(why.length)return blocked('Không xóa được '+unitName(u),`Đơn vị đang có ${why.join(', ')}. Hãy chuyển hoặc xóa các mục này trước.`);
    confirmDel('Xóa đơn vị',`Xóa <b>${esc(unitName(u))}</b> (${esc(u.k)}) khỏi sơ đồ tổ chức?`,()=>{S.org.units.splice(S.org.units.indexOf(u),1);log('Xóa đơn vị',u.k);toast('Đã xóa đơn vị');});},
  posNew:()=>openPosForm(null),
  posEdit:d=>openPosForm(S.org.pos.find(p=>p.c===d.c)),
  posDel:d=>{const p=S.org.pos.find(x=>x.c===d.c);const n=S.hr.emps.filter(e=>e.pos===p.c).length;
    if(n)return blocked('Không xóa được chức danh',`Có ${n} nhân viên (kể cả đã nghỉ) đang gắn chức danh <b>${esc(p.t)}</b>. Hãy đổi chức danh của họ trước.`);
    confirmDel('Xóa chức danh',`Xóa chức danh <b>${esc(p.t)}</b> (${esc(p.c)})?`,()=>{S.org.pos.splice(S.org.pos.indexOf(p),1);log('Xóa chức danh',p.c);toast('Đã xóa chức danh');});},
  taskEdit:d=>openTaskForm(S.hr.tasks.find(t=>t.id===d.id)),
  taskDel:d=>{const t=S.hr.tasks.find(x=>x.id===d.id);
    confirmDel('Xóa việc',`Xóa việc <b>${esc(t.title)}</b>?${t.status!=='moi'?' Việc đang thực hiện, người phụ trách sẽ không còn thấy việc này.':''}`,()=>{S.hr.tasks.splice(S.hr.tasks.indexOf(t),1);log('Xóa việc',t.title);toast('Đã xóa việc');});}
});

/* ---------- Sửa / xóa: hợp đồng, đối tác ---------- */
function openContractForm(c){
  openModal(c?'Sửa hợp đồng · '+c.code:'Thêm hợp đồng',`<div class="fgrid">
    <div class="f"><label for="hcode">Số hợp đồng <span class="req">*</span></label><input id="hcode" name="code" value="${c?esc(c.code):''}" placeholder="VD: HĐMB-04/2026"></div>
    <div class="f"><label for="hkind">Loại</label><select id="hkind" name="kind">${['Mua','Bán'].map(k=>`<option ${c&&c.kind===k?'selected':''}>${k}</option>`).join('')}</select></div>
    <div class="f full"><label for="hpartner">Đối tác <span class="req">*</span></label><select id="hpartner" name="partner">${S.partners.map(p=>`<option value="${p.id}" ${c&&c.partner===p.id?'selected':''}>${esc(p.name)} (${p.kind==='ncc'?'NCC':'KH'})</option>`).join('')}</select></div>
    <div class="f full"><label for="htitle">Nội dung <span class="req">*</span></label><input id="htitle" name="title" value="${c?esc(c.title):''}"></div>
    <div class="f"><label for="hvalue">Giá trị</label><input id="hvalue" name="value" type="number" min="0" step="any" value="${c&&c.value?c.value:''}"><span class="hint">Để trống nếu tính theo từng đơn hàng.</span></div>
    <div class="f"><label for="hcur">Tiền tệ</label><select id="hcur" name="currency">${['VND','USD'].map(k=>`<option ${c&&c.currency===k?'selected':''}>${k}</option>`).join('')}</select></div>
    <div class="f"><label for="hsign">Ngày ký <span class="req">*</span></label><input id="hsign" name="sign" type="date" value="${c?c.sign:today()}"></div>
    <div class="f"><label for="hend">Ngày hết hạn <span class="req">*</span></label><input id="hend" name="end" type="date" value="${c?c.end:addDays(365)}"></div></div>`,
    `${c?`<button type="button" class="btn danger" data-act="ctDel" data-code="${esc(c.code)}">Xóa</button><span style="flex:1"></span>`:''}<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn pri">Lưu</button>`,
    fd=>{clearErr();let ok=true;const code=(fd.get('code')||'').trim(),title=(fd.get('title')||'').trim(),sign=fd.get('sign'),end=fd.get('end');
      if(!code){fieldErr('code','Nhập số hợp đồng.');ok=false;}else if(S.fin.contracts.some(x=>x.code===code&&x!==c)){fieldErr('code','Số hợp đồng đã có.');ok=false;}
      if(!title){fieldErr('title','Nhập nội dung.');ok=false;}if(!sign){fieldErr('sign','Chọn ngày ký.');ok=false;}if(!end||end<sign){fieldErr('end','Ngày hết hạn phải sau ngày ký.');ok=false;}
      if(!ok)return false;
      const data={code,kind:fd.get('kind'),partner:fd.get('partner'),title,value:Number(fd.get('value'))||0,currency:fd.get('currency'),sign,end};
      if(c){Object.assign(c,data);log('Sửa hợp đồng',code);}else{S.fin.contracts.push(Object.assign({files:[]},data));log('Thêm hợp đồng',code);}
      save();closeModal();render();toast('Đã lưu hợp đồng '+code);return true;});}
const partnerUsed=p=>S.ledger.some(e=>e.partnerId===p.id)||S.proposals.some(x=>x.fields&&x.fields.partnerId===p.id)||S.fin.contracts.some(c=>c.partner===p.id)||S.inv.vouchers.some(v=>v.partnerId===p.id);
Object.assign(A,{
  ctNew:()=>openContractForm(null),
  ctEdit:d=>openContractForm(S.fin.contracts.find(c=>c.code===d.code)),
  ctDel:d=>{const c=S.fin.contracts.find(x=>x.code===d.code);confirmDel('Xóa hợp đồng',`Xóa hợp đồng <b>${esc(c.code)}</b> – ${esc(c.title)}? Hóa đơn và chứng từ trong sổ công nợ không bị ảnh hưởng.`,()=>{S.fin.contracts.splice(S.fin.contracts.indexOf(c),1);log('Xóa hợp đồng',c.code);toast('Đã xóa hợp đồng');});},
  ptDel:d=>{const p=pById(d.id);if(partnerUsed(p))return blocked('Không xóa được '+p.name,'Đối tác đã có hóa đơn, chứng từ, đề xuất, hợp đồng hoặc phiếu kho nên không xóa để giữ lịch sử công nợ.');
    confirmDel('Xóa đối tác',`Xóa <b>${esc(p.name)}</b> (${esc(p.code)})?`,()=>{S.partners.splice(S.partners.indexOf(p),1);log('Xóa đối tác',p.code);ui.view='debts';toast('Đã xóa đối tác');});}
});

document.addEventListener('input',e=>{const el=e.target;if(!el.classList||!el.classList.contains('money-in'))return;
  const pos=el.selectionStart,digitsBefore=el.value.slice(0,pos).replace(/[^\d,]/g,'').length;const nv=fmtMoneyIn(el.value);if(nv===el.value)return;el.value=nv;
  let n=0,p=0;while(p<nv.length&&n<digitsBefore){if(/[\d,]/.test(nv[p]))n++;p++;}try{el.setSelectionRange(p,p);}catch(_){}});
/* ---------- Link đối chiếu riêng cho từng NCC (cổng chỉ xem công nợ của chính NCC đó) ---------- */
const portalToken=()=>{const m=/^#doichieu=([A-Za-z0-9]+)$/.exec(location.hash);return m?m[1]:null;};
const portalUrl=p=>location.href.split('#')[0]+'#doichieu='+p.portal.token;
function newToken(){const a=new Uint8Array(18);try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<a.length;i++)a[i]=Math.random()*256|0;}return Array.from(a,b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%58]).join('');}
const reconBy=r=>r.src==='ncc'?'NCC xác nhận qua link':uname(r.by);
function renderPortal(){
  const tk=portalToken();const p=S.partners.find(x=>x.kind==='ncc'&&x.portal&&x.portal.token===tk);
  if(!p||!p.portal.active)return `<div class="portal-wrap"><div class="portal-h"><b>Công ty Tín Đức</b><span class="sub">Cổng đối chiếu công nợ nhà cung cấp</span></div>
    <div class="alert warn">Link đối chiếu không đúng hoặc đã hết hiệu lực. Vui lòng liên hệ Phòng Kế toán Công ty Tín Đức để nhận link mới.</div></div>`;
  const from=ui.qfrom||(ui.qfrom=today().slice(0,8)+'01'),to=ui.qto||(ui.qto=today());const s=partnerStats(p.id);
  const open=s.A.inv.filter(i=>i.open>0);const mine=(p.recons||[]).filter(r=>r.src==='ncc').slice().reverse();
  return `<div class="portal-wrap">
    <div class="portal-h"><div><b>Công ty Tín Đức</b><span class="sub">Cổng đối chiếu công nợ nhà cung cấp</span></div><span class="sub">Bạn đang xem công nợ của <b>${esc(p.name)}</b></span></div>
    <div class="tiles t4"><div class="tile"><span class="k">Tín Đức còn phải trả</span><span class="v num">${money(s.bal,p.currency)}</span><span class="s">tính đến hôm nay</span></div>
      <div class="tile ${s.overdue>0?'warn':''}"><span class="k">Đã quá hạn</span><span class="v num">${money(s.overdue,p.currency)}</span></div>
      <div class="tile"><span class="k">Đến hạn 7 ngày tới</span><span class="v num">${money(s.soon,p.currency)}</span></div>
      <div class="tile"><span class="k">Hóa đơn chưa thanh toán xong</span><span class="v num">${open.length}</span></div></div>
    <section class="panel"><div class="panel-h"><h2>Hóa đơn còn nợ</h2></div>
      ${open.length?`<div class="tbl-wrap"><table><thead><tr><th>Số hóa đơn</th><th>Ngày</th><th>Hạn thanh toán</th><th class="r">Giá trị</th><th class="r">Đã trả</th><th class="r">Còn nợ</th></tr></thead><tbody>
      ${open.map(i=>`<tr><td class="code">${esc(i.e.docNo)}</td><td class="num">${fDate(i.e.date)}</td><td class="num">${fDate(i.e.due)}${i.days>0?` <span class="pill st-over">Quá ${i.days} ngày</span>`:''}</td><td class="r num">${nf(i.e.amount)}</td><td class="r num">${nf(i.paid)}</td><td class="r num"><b>${nf(i.open)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Không còn hóa đơn nào chưa thanh toán.</div>'}</section>
    <section class="panel"><div class="panel-h"><h2>Biên bản đối chiếu</h2></div><div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
      <div class="filters" style="padding:0;border:0"><div class="f"><label for="qfrom">Từ ngày</label><input id="qfrom" type="date" value="${from}"></div><div class="f"><label for="qto">Đến ngày</label><input id="qto" type="date" value="${to}"></div></div>
      ${reconDoc(p,from,to)}
      <div class="actions"><button class="btn" data-act="portalPrint">In / lưu PDF</button><button class="btn danger" data-act="portalReply" data-ok="0">Báo chênh lệch</button><button class="btn ok" data-act="portalReply" data-ok="1">Xác nhận số liệu khớp</button></div>
      ${mine.length?`<div><b>Các lần bạn đã phản hồi</b>${mine.map(r=>`<div class="sub">${fDT(r.at)} · kỳ ${fDate(r.from)}–${fDate(r.to)} · ${r.ok?'<span class="okc">Khớp</span>':'<span class="badc">Chênh lệch</span>'}${r.note?' · '+esc(r.note):''}${r.contact?' · '+esc(r.contact):''}</div>`).join('')}</div>`:''}</div></section>
    <div class="sub" style="text-align:center;padding:8px 0 24px">Link này chỉ dùng cho ${esc(p.name)}. Vui lòng không chuyển cho người khác.</div></div>`;
}
function portalModal(p){
  const L=p.portal&&p.portal.active;const rs=(p.recons||[]).filter(r=>r.src==='ncc').slice().reverse();
  openModal('Link đối chiếu · '+p.name,`${L?`<div class="f full"><label for="plink">Link riêng của ${esc(p.name)}</label><input id="plink" readonly value="${esc(portalUrl(p))}"><span class="hint">Tạo ngày ${fDT(p.portal.at)} bởi ${esc(uname(p.portal.by))}. NCC mở link chỉ thấy công nợ và biên bản đối chiếu của chính họ, không thấy menu, dữ liệu NCC khác hay các module khác.</span></div>`
      :`<div class="alert info" style="margin:0">${p.portal?'Link cũ đã tắt. ':''}Tạo một link riêng cho ${esc(p.name)}. NCC mở link sẽ chỉ xem được công nợ của họ và bấm xác nhận khớp hoặc báo chênh lệch.</div>`}
    <div class="alert warn" style="margin:0">Bản thử lưu dữ liệu trên trình duyệt này, nên link chỉ mở được trên chính máy này để xem thử. Hệ thống thật sẽ lưu trên máy chủ, NCC mở được từ máy của họ; link có hạn dùng và tắt được bất cứ lúc nào.</div>
    ${rs.length?`<div><b>Phản hồi của NCC</b>${rs.map(r=>`<div class="sub">${fDT(r.at)} · kỳ ${fDate(r.from)}–${fDate(r.to)} · ${r.ok?'<span class="okc">Khớp</span>':'<span class="badc">Chênh lệch</span>'}${r.note?' · '+esc(r.note):''}${r.contact?' · '+esc(r.contact):''}</div>`).join('')}</div>`:''}`,
    `${L?`<button type="button" class="btn danger" data-act="portalOff" data-id="${p.id}">Tắt link</button><button type="button" class="btn" data-act="portalNew" data-id="${p.id}">Tạo link mới</button><span style="flex:1"></span><button type="button" class="btn" data-act="portalView" data-id="${p.id}">Xem như NCC</button><button type="button" class="btn pri" data-act="portalCopy">Sao chép link</button>`
      :`<button type="button" class="btn" data-act="close">Đóng</button><button type="button" class="btn pri" data-act="portalNew" data-id="${p.id}">Tạo link</button>`}`,()=>true);}
Object.assign(A,{
  portal:d=>portalModal(pById(d.id)),
  portalNew:d=>{const p=pById(d.id);const had=p.portal&&p.portal.active;p.portal={token:newToken(),active:true,at:nowISO(),by:S.role};log(had?'Tạo lại link đối chiếu (link cũ hết hiệu lực)':'Tạo link đối chiếu NCC',p.code);save();portalModal(p);toast(had?'Đã tạo link mới, link cũ không dùng được nữa':'Đã tạo link');},
  portalOff:d=>{const p=pById(d.id);p.portal.active=false;log('Tắt link đối chiếu NCC',p.code);save();portalModal(p);toast('Đã tắt link');},
  portalCopy:()=>{const el=$('#plink');try{navigator.clipboard.writeText(el.value).then(()=>toast('Đã sao chép link'),()=>{el.select();toast('Bấm Ctrl+C để sao chép');});}catch(e){el.select();toast('Bấm Ctrl+C để sao chép');}},
  portalView:d=>{const p=pById(d.id);closeModal();location.hash='doichieu='+p.portal.token;},
  portalPrint:()=>window.print(),
  portalReply:d=>{const ok=d.ok==='1';const p=S.partners.find(x=>x.portal&&x.portal.token===portalToken()&&x.portal.active);if(!p)return;
    openModal(ok?'Xác nhận số liệu khớp':'Báo chênh lệch',`<div class="sub">Kỳ ${fDate(ui.qfrom)} – ${fDate(ui.qto)} · ${esc(p.name)}</div>
      <div class="f"><label for="pcontact">Người xác nhận <span class="req">*</span></label><input id="pcontact" name="contact" placeholder="Họ tên, chức vụ"></div>
      <div class="f"><label for="pnote">${ok?'Ghi chú':'Nội dung chênh lệch'}${ok?'':' <span class="req">*</span>'}</label><textarea id="pnote" name="note" placeholder="${ok?'':'VD: Hóa đơn 0000123 bên chúng tôi ghi 12.500.000'}"></textarea></div>`,
      `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn ${ok?'ok':'danger'}">Gửi cho Tín Đức</button>`,
      fd=>{const c=(fd.get('contact')||'').trim(),n=(fd.get('note')||'').trim();if(!c){fieldErr('contact','Nhập người xác nhận.');return false;}if(!ok&&!n){fieldErr('note','Ghi rõ khoản chênh lệch.');return false;}
        (p.recons||(p.recons=[])).push({from:ui.qfrom,to:ui.qto,ok,note:n,contact:c,by:'ncc',src:'ncc',at:nowISO()});log('NCC phản hồi đối chiếu qua link',`${p.code}: ${ok?'khớp':'chênh lệch'}`);
        save();closeModal();render();toast('Đã gửi phản hồi cho Công ty Tín Đức');return true;});}
});
document.addEventListener('change',e=>{if(e.target.id==='qfrom'||e.target.id==='qto'){ui[e.target.id]=e.target.value;render();}});
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0);});

load();renderRoleSel();render();
})();
</script>

</body>
