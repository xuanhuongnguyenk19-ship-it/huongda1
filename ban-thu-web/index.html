<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tín Đức ERP – bản thử</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: ERP shell – navy sidebar trái, topbar tìm kiếm + chọn người dùng, nội dung dạng bảng/biểu mẫu */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f8fafc; --line:#dbe2ea; --fg:#15202b; --muted:#5a6878;
  --navy:#0e2a47; --navy-2:#163a60; --navy-fg:#dbe6f3; --navy-muted:#8ea6c2;
  --accent:#1d5fa8; --accent-fg:#ffffff; --accent-soft:#e6eef8;
  --amber:#9a5b00; --amber-bg:#fdf1dc; --red:#b42318; --red-bg:#fdeceb; --green:#1d7a3e; --green-bg:#e4f4e9;
  --purple:#5b3fb0; --purple-bg:#efeafc; --gray:#5a6878; --gray-bg:#edf0f4; --age60:#c2621b; --age90:#7d1a12;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c131b; --surface:#131d28; --surface-2:#172331; --line:#263546; --fg:#e4eaf1; --muted:#95a3b4;
  --navy:#08182a; --navy-2:#12304f; --navy-fg:#dbe6f3; --navy-muted:#7f97b3;
  --accent:#5b9fe6; --accent-fg:#0a1622; --accent-soft:#16304d;
  --amber:#f0b45a; --amber-bg:#3a2a10; --red:#f3867c; --red-bg:#3d1916; --green:#6fd08f; --green-bg:#13321e;
  --purple:#b6a2f5; --purple-bg:#2a2148; --gray:#a3b0bf; --gray-bg:#222f3d; --age60:#f29a5a; --age90:#ff8a7e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131b; --surface:#131d28; --surface-2:#172331; --line:#263546; --fg:#e4eaf1; --muted:#95a3b4;
  --navy:#08182a; --navy-2:#12304f; --navy-fg:#dbe6f3; --navy-muted:#7f97b3;
  --accent:#5b9fe6; --accent-fg:#0a1622; --accent-soft:#16304d;
  --amber:#f0b45a; --amber-bg:#3a2a10; --red:#f3867c; --red-bg:#3d1916; --green:#6fd08f; --green-bg:#13321e;
  --purple:#b6a2f5; --purple-bg:#2a2148; --gray:#a3b0bf; --gray-bg:#222f3d; --age60:#f29a5a; --age90:#ff8a7e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--navy);color:var(--navy-fg);display:flex;flex-direction:column;padding:16px 10px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:32px;height:32px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{display:block;font-size:15px;color:#fff}
.brand small{color:var(--navy-muted);font-size:11.5px}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy-muted);padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--navy-fg);padding:8px 10px;border-radius:6px;cursor:pointer}
.nav:hover{background:var(--navy-2)}
.nav.on{background:var(--navy-2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:600}
.nav .later{margin-left:auto;font-size:10.5px;color:var(--navy-muted)}
.nav.dim{color:var(--navy-muted)}
/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.btn.menu-btn{display:none}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 10px;min-width:0}
.search input{border:0;background:none;outline:none;padding:8px 0;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.who{display:flex;align-items:center;gap:8px}
.who label{font-size:12px;color:var(--muted)}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;max-width:270px}
.demo-chip{font-size:11.5px;background:var(--amber-bg);color:var(--amber);padding:3px 9px;border-radius:10px;font-weight:600;white-space:nowrap}
.view{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:21px;text-wrap:balance}
.crumb{font-size:12px;color:var(--muted);margin-bottom:2px}
.crumb button{background:none;border:0;color:var(--accent);padding:0;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{margin:0;font-size:15px}
.panel-b{padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700}
.tile .s{font-size:12px;color:var(--muted)}
.tile.warn{box-shadow:inset 0 3px 0 var(--red)}
.tile.att{box-shadow:inset 0 3px 0 var(--amber)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.cancelled td{color:var(--muted);text-decoration:line-through}
tr.cancelled td.cxcell,tr.cancelled .cxs,.cx{text-decoration:none;color:var(--fg)}
.cx{display:block;font-size:12px;line-height:1.5;background:var(--surface-2);border-left:3px solid var(--red);padding:4px 8px;border-radius:4px}
.code{font-weight:600;color:var(--accent);white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.filters input{flex:1 1 200px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
/* pills */
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.st-nhap{background:var(--gray-bg);color:var(--gray)}
.st-cho{background:var(--amber-bg);color:var(--amber)}
.st-duyet{background:var(--accent-soft);color:var(--accent)}
.st-dachi{background:var(--purple-bg);color:var(--purple)}
.st-hoanthanh{background:var(--green-bg);color:var(--green)}
.st-tuchoi{background:var(--red-bg);color:var(--red)}
.st-huy{background:var(--gray-bg);color:var(--gray);text-decoration:line-through}
.st-over{background:var(--red-bg);color:var(--red)}
.type{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
/* detail */
.dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 16px;margin:0}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.timeline li:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.dot.now{border-color:var(--amber);color:var(--amber)}
.dot.bad{background:var(--red);border-color:var(--red);color:#fff}
.note-box{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;margin-top:4px}
.alert{border-radius:6px;padding:10px 14px;font-size:13px}
.alert.warn{background:var(--amber-bg);color:var(--amber)}
.alert.bad{background:var(--red-bg);color:var(--red)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px}
.tab{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.modal{background:var(--surface);border-radius:10px;width:min(760px,100%);border:1px solid var(--line);display:flex;flex-direction:column}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f .err{color:var(--red);font-size:12px}
.f .hint{color:var(--muted);font-size:12px}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--red)}
.lines{display:flex;flex-direction:column;gap:6px}
.line-row{display:grid;grid-template-columns:2fr 1.6fr .8fr .8fr 32px;gap:6px}
.line-row input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.line-h{display:grid;grid-template-columns:2fr 1.6fr .8fr .8fr 32px;gap:6px;font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--green);font-weight:700}
.no{color:var(--muted)}
/* sản xuất */
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.chip b{margin-left:4px;font-variant-numeric:tabular-nums;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.red b{color:var(--red)}.chip.on.red b{color:inherit}
.chips input{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 9px;min-width:0;flex:0 1 260px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer}
.seg2 button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.bar{height:6px;background:var(--gray-bg);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.segbar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.segbar i{height:5px;border-radius:2px;background:var(--gray-bg);position:relative;overflow:hidden;display:block}
.segbar i b{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;padding:12px 16px 16px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.col-h .n{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.late{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.card .top-line{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stage{border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stage.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stage h4{margin:0;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.kv{display:grid;grid-template-columns:1fr auto;font-size:12.5px;gap:2px 8px}
.kv span:nth-child(odd){color:var(--muted)}
.okc{font-size:11.5px;color:var(--green);font-weight:600}
.badc{font-size:11.5px;color:var(--red);font-weight:600}
.recon{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;align-items:center}
.tem{background:#fff;color:#111;border:1px dashed #8a8a8a;border-radius:8px;padding:14px;display:flex;gap:14px;align-items:center;max-width:100%;flex-wrap:wrap}
.tem .qr{width:140px;height:140px;flex:none;display:grid;place-items:center}
.tem .qr img,.tem .qr canvas{width:140px;height:140px}
.wk{display:flex;flex-wrap:wrap;gap:6px}
.f .wk label{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-weight:400;font-size:13px;cursor:pointer}
.mat-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 32px;gap:6px}
.mat-row select,.mat-row input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.inline-list{display:flex;flex-direction:column}
.inline-list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.inline-list .it:last-child{border-bottom:0}
/* nhân sự, báo cáo, quản trị */
.design{display:inline-block;font-size:11px;font-weight:600;color:var(--purple);background:var(--purple-bg);border-radius:10px;padding:2px 8px;vertical-align:middle}
.att{border-collapse:separate;border-spacing:0;font-size:12px}
.att th,.att td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line);min-width:26px}
.att th.name,.att td.name{text-align:left;position:sticky;left:0;background:var(--surface);min-width:170px;z-index:1;padding-left:10px}
.att th.name{background:var(--surface-2)}
.att td.sun,.att th.sun{background:var(--surface-2)}
.att .c{display:inline-block;min-width:22px;border-radius:4px;font-weight:600;cursor:pointer;border:0;padding:2px 0;font-size:11.5px}
.c-X{background:var(--green-bg);color:var(--green)}.c-P{background:var(--accent-soft);color:var(--accent)}.c-KL{background:var(--amber-bg);color:var(--amber)}.c-CN{background:transparent;color:var(--muted)}.c-adj{box-shadow:inset 0 0 0 1.5px var(--purple)}
.att .ot{display:block;font-size:10px;color:var(--purple);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.chart{width:100%;height:auto;display:block}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cat{border:1px solid var(--line);border-radius:7px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.cat:hover,.cat.on{border-color:var(--accent)}
.cat b{font-size:20px}
.perm td input{width:16px;height:16px;accent-color:var(--accent)}
.prio-1{color:var(--red);font-weight:600}.prio-2{color:var(--amber);font-weight:600}.prio-3{color:var(--muted)}
.stars{color:var(--amber);letter-spacing:1px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.person{display:flex;gap:10px;align-items:center}
.col-code{width:1%;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--accent);padding-right:6px!important}
th.col-code{color:var(--muted)}
.col-main{min-width:240px;width:45%}
/* công nợ */
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.agebar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--gray-bg);gap:1px;min-width:90px;width:100%}
.agebar i{display:block;height:100%}

const r2=n=>Math.round(Number(n)*100)/100;
const BUCKETS=[['cur','Trong hạn'],['b30','Quá 1–30 ngày'],['b60','Quá 31–60 ngày'],['b90','Quá 61–90 ngày'],['b90p','Quá trên 90 ngày']];
const BCOLOR={cur:'var(--accent)',b30:'var(--amber)',b60:'var(--age60)',b90:'var(--red)',b90p:'var(--age90)'};
const invTotal=(net,vat,cur)=>{const t=Number(net)*(1+(vat==='KCT'?0:Number(vat))/100);return cur==='VND'?Math.round(t):r2(t);};
const bucketOf=d=>d<=0?'cur':d<=30?'b30':d<=60?'b60':d<=90?'b90':'b90p';
/* Phân bổ thanh toán vào hóa đơn: theo phân bổ chỉ định trước, phần còn lại trả cho hóa đơn đến hạn sớm nhất */
function allocate(pid){
  const es=S.ledger.filter(e=>e.partnerId===pid&&!e.cancelled);
  const inv=es.filter(e=>e.kind==='phatsinh').sort((a,b)=>(a.due||a.date).localeCompare(b.due||b.date)||a.date.localeCompare(b.date)).map(e=>({e,paid:0,pays:[]}));
  const pays=es.filter(e=>e.kind==='thanhtoan').sort((a,b)=>a.date.localeCompare(b.date)||a.at.localeCompare(b.at));
  const free=[];
  pays.forEach(pm=>{let rest=Number(pm.amount);
    (pm.alloc||[]).forEach(a=>{const it=inv.find(x=>x.e.id===a.invId);if(!it)return;const take=Math.min(Number(a.amount),Number(it.e.amount)-it.paid,rest);if(take>0){it.paid+=take;rest-=take;it.pays.push({pm,amt:take});}});
    if(rest>0)free.push({pm,rest});});
  free.forEach(f=>{for(const it of inv){if(f.rest<=0)break;const take=Math.min(f.rest,Number(it.e.amount)-it.paid);if(take>0){it.paid+=take;f.rest-=take;it.pays.push({pm:f.pm,amt:take});}}});
  const td=today();
  inv.forEach(it=>{it.paid=r2(it.paid);it.open=r2(Number(it.e.amount)-it.paid);it.days=it.e.due?daysBetween(it.e.due,td):0;
    it.status=it.open<=0?'paid':it.days>0?'over':it.paid>0?'part':'open';});
  return {inv,pays,credit:r2(free.reduce((t,f)=>t+f.rest,0))};
}
function partnerStats(pid){
  const A=allocate(pid);const in7=addDays(7);
  const ps=A.inv.reduce((t,i)=>t+Number(i.e.amount),0),paid=A.pays.reduce((t,x)=>t+Number(x.amount),0);
  const B={cur:0,b30:0,b60:0,b90:0,b90p:0};let overdue=0,nextDue=null,soon=0;
  A.inv.forEach(i=>{if(i.open<=0)return;B[bucketOf(i.days)]+=i.open;if(i.days>0)overdue+=i.open;else{if(!nextDue||i.e.due<nextDue)nextDue=i.e.due;if(i.e.due<=in7)soon+=i.open;}});
  const rate=A.inv.length?Number(A.inv[A.inv.length-1].e.rate||1):1;
  const vnd=A.inv.reduce((t,i)=>t+Number(i.e.amount)*Number(i.e.rate||1),0)-A.pays.reduce((t,x)=>t+Number(x.amount)*Number(x.rate||1),0);
  return {ps:r2(ps),paid:r2(paid),bal:r2(ps-paid),overdue:r2(overdue),overdueVnd:Math.round(overdue*rate),nextDue,vnd:Math.round(vnd),B,soon:r2(soon),soonVnd:soon*rate,credit:A.credit,A,rate};
}

/* ---------- các mảnh dùng chung ---------- */
const pill=st=>`<span class="pill st-${st}">${STATUS[st]}</span>`;
function stepText(p){
  if(p.status==='cho'){const st=p.steps[p.curStep];return `Chờ ${STEP_LABEL[st.role]} (${p.curStep+1}/${p.steps.length})`;}
  if(p.status==='nhap'&&p.returned)return 'Bị trả lại – cần sửa';
  if(p.status==='duyet')return p.type==='VT'?'Chờ cấp / mua':'Chờ kế toán chi';
  if(p.status==='dachi')return p.fields.dueBack<today()?`Quá hạn hoàn ứng ${daysBetween(p.fields.dueBack,today())} ngày`:`Hạn hoàn ứng ${fDate(p.fields.dueBack)}`;
  return '';
}
const amountCell=p=>p.type==='VT'?'<span class="sub">—</span>':`<span class="num">${money(p.fields.amount,p.fields.currency)}</span>`;
function propRows(list,empty){
  if(!list.length)return `<div class="empty">${empty}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th class="col-code">Mã</th><th>Nội dung</th><th>Người đề xuất</th><th class="r">Số tiền</th><th>Ngày tạo</th><th>Trạng thái</th></tr></thead><tbody>
  ${list.map(p=>`<tr class="click" data-act="open" data-id="${p.id}"><td class="col-code" title="${esc(p.code)}">${esc(p.code.replace(/^DX-/,''))}</td>
  <td class="col-main"><span class="type">${TYPES[p.type]}</span> ${esc(p.title)}<div class="sub">${esc(stepText(p))}</div></td><td>${esc(uname(p.createdBy))}<div class="sub">${esc(p.dept)}</div></td>
  <td class="r">${amountCell(p)}</td><td class="num">${fDate(p.createdAt.slice(0,10))}</td><td>${pill(p.status)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- Tổng quan ---------- */

  const kh=S.partners.filter(p=>p.kind==='kh').map(p=>partnerStats(p.id));

  const showMoney=can.debts();

    <button class="tile ${PO.filter(late).length?'warn':''}" data-act="go" data-v="prod" data-pf="late"><span class="k">Lệnh trễ hạn</span><span class="v num">${PO.filter(late).length}</span><span class="s">chưa xong khi đã quá hạn</span></button>
    <button class="tile ${pendRep?'att':''}" data-act="go" data-v="review"><span class="k">Sản lượng chờ duyệt</span><span class="v num">${pendRep}</span><span class="s">phiếu báo của tổ</span></button>`:'';

  return `
  <div class="head"><div><div class="crumb">Xin chào, ${esc(u.name)} · ${esc(u.title)}</div><h1>Tổng quan</h1></div>
    <div class="actions"><button class="btn pri" data-act="new">+ Tạo đề xuất</button></div></div>
  <div class="tiles">${prodTiles}
    <button class="tile ${mine.length+prodTasks().length?'att':''}" data-act="go" data-v="inbox"><span class="k">Việc cần bạn xử lý</span><span class="v num">${mine.length+prodTasks().length}</span><span class="s">duyệt, chi tiền, sửa lại</span></button>
    <button class="tile" data-act="go" data-v="proposals" data-status="cho"><span class="k">Đề xuất đang chờ duyệt</span><span class="v num">${waiting.length}</span><span class="s">${can.viewAll()?'toàn công ty':'của bạn'}</span></button>
    ${showMoney?`
    <button class="tile" data-act="go" data-v="debts" data-tab="ncc"><span class="k">Phải trả nhà cung cấp</span><span class="v num">${money(sum(ncc,'vnd'))}</span><span class="s">quá hạn ${money(sum(ncc,'overdueVnd'))}</span></button>
    <button class="tile ${sum(kh,'overdueVnd')>0?'warn':''}" data-act="go" data-v="debts" data-tab="kh"><span class="k">Phải thu khách hàng</span><span class="v num">${money(sum(kh,'vnd'))}</span><span class="s">quá hạn ${money(sum(kh,'overdueVnd'))} (quy đổi)</span></button>`:''}
    <button class="tile ${tuOver.length?'warn':''}" data-act="go" data-v="advances"><span class="k">Tạm ứng quá hạn hoàn ứng</span><span class="v num">${tuOver.length}</span><span class="s">${money(tuOver.reduce((t,p)=>t+amountVND(p),0))}</span></button>
  </div>
  <div>
    <section class="panel"><div class="panel-h"><h2>Việc cần bạn xử lý</h2><button class="btn sm" data-act="go" data-v="inbox">Xem tất cả</button></div>
      ${propRows(mine.slice(0,6),'Không có việc nào đang chờ bạn.')}</section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Đề xuất gần đây</h2><button class="btn sm" data-act="go" data-v="proposals">Mở danh sách</button></div>
    ${propRows(vis.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5),'Chưa có đề xuất.')}</section>`;

/* ---------- Danh sách đề xuất ---------- */
function renderProposals(){
  const q=ui.f.q.trim().toLowerCase();
  let list=visibleProposals().filter(p=>(!ui.f.type||p.type===ui.f.type)&&(!ui.f.status||p.status===ui.f.status)&&
    (!q||[p.code,p.title,uname(p.createdBy),p.dept].join(' ').toLowerCase().includes(q)));
  list.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const per=10,pages=Math.max(1,Math.ceil(list.length/per));ui.page=Math.min(ui.page,pages);
  const shown=list.slice((ui.page-1)*per,ui.page*per);
  return `<div class="head"><div><div class="crumb">Tài chính – Kế toán</div><h1>Đề xuất</h1></div>
    <div class="actions"><button class="btn" data-act="export">Xuất Excel</button><button class="btn pri" data-act="new">+ Tạo đề xuất</button></div></div>
  <section class="panel">
    <div class="filters">
      <input id="fq" placeholder="Tìm mã, nội dung, người đề xuất" value="${esc(ui.f.q)}">
      <select id="ftype" aria-label="Loại"><option value="">Tất cả loại</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${ui.f.type===k?'selected':''}>${v}</option>`).join('')}</select>
      <select id="fstatus" aria-label="Trạng thái"><option value="">Tất cả trạng thái</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${ui.f.status===k?'selected':''}>${v}</option>`).join('')}</select>
    </div>
    ${propRows(shown,'Không có đề xuất khớp bộ lọc.')}
    <div class="pager"><span>${list.length} đề xuất · trang ${ui.page}/${pages}</span>
      <span class="actions"><button class="btn sm" data-act="page" data-d="-1" ${ui.page<=1?'disabled':''}>‹ Trước</button><button class="btn sm" data-act="page" data-d="1" ${ui.page>=pages?'disabled':''}>Sau ›</button></span></div>
  </section>`;
}

/* ---------- Chi tiết đề xuất ---------- */
function renderDetail(){
  const p=S.proposals.find(x=>x.id===ui.id);
  if(!p||!(can.viewAll()||p.createdBy===S.role))return `<div class="alert bad">Không tìm thấy đề xuất, hoặc vai trò hiện tại không có quyền xem.</div><div><button class="btn" data-act="go" data-v="proposals">Về danh sách</button></div>`;
  const f=p.fields;
  const partner=f.partnerId?S.partners.find(x=>x.id===f.partnerId):null;
  const btns=[];
  if(can.edit(p))btns.push(`<button class="btn" data-act="edit" data-id="${p.id}">Sửa</button>`);
  if(can.submit(p))btns.push(`<button class="btn pri" data-act="submit" data-id="${p.id}">Gửi duyệt</button>`);
  if(can.approve(p))btns.push(`<button class="btn" data-act="return" data-id="${p.id}">Trả lại</button><button class="btn danger" data-act="reject" data-id="${p.id}">Từ chối</button><button class="btn ok" data-act="approve" data-id="${p.id}">Duyệt</button>`);
  if(can.pay(p))btns.push(`<button class="btn pri" data-act="pay" data-id="${p.id}">${p.type==='TU'?'Chi tạm ứng':'Lập phiếu chi'}</button>`);
  if(can.settle(p))btns.push(`<button class="btn pri" data-act="settle" data-id="${p.id}">Quyết toán tạm ứng</button>`);
  if(can.fulfill(p))btns.push(`<button class="btn pri" data-act="fulfill" data-id="${p.id}">Xác nhận đã cấp / mua</button>`);
  if(can.del(p))btns.push(`<button class="btn danger" data-act="delProp" data-id="${p.id}">Xóa</button>`);
  if(can.cancel(p))btns.push(`<button class="btn danger" data-act="cancel" data-id="${p.id}">Hủy</button>`);
  if(can.restore(p))btns.push(`<button class="btn" data-act="restore" data-id="${p.id}">Khôi phục</button>`);
  const rows=[];
  rows.push(['Người đề xuất',`${esc(uname(p.createdBy))} · ${esc(p.dept)}`]);
  rows.push(['Ngày tạo',fDT(p.createdAt)]);
  if(p.type==='VT'){
    rows.push(['Danh sách vật tư',`<div class="tbl-wrap"><table><thead><tr><th>Tên</th><th>Quy cách</th><th class="r">SL</th><th>ĐVT</th></tr></thead><tbody>${f.lines.map(l=>`<tr><td>${esc(l.ten)}</td><td>${esc(l.quycach)}</td><td class="r num">${esc(l.sl)}</td><td>${esc(l.dvt)}</td></tr>`).join('')}</tbody></table></div>`]);
    rows.push(['Mục đích sử dụng',esc(f.purpose)]);
    rows.push(['Thời gian cần',fDate(f.needBy)]);
  }
  if(p.type==='TT'){
    rows.push(['Đối tượng nhận',partner?`${esc(partner.name)} <span class="sub">(${esc(partner.code)} · công nợ sẽ tự giảm khi chi)</span>`:esc(f.partnerText)]);
    rows.push(['Số tiền',`<b class="num">${money(f.amount,f.currency)}</b>${f.currency==='USD'?` <span class="sub">× ${Number(f.rate).toLocaleString('vi-VN')} = ${money(amountVND(p))}</span>`:''}`]);
    if(f.invId){const ie=S.ledger.find(e=>e.id===f.invId);if(ie)rows.push(['Cho hóa đơn',`<button class="link" data-act="partnerGo" data-id="${ie.partnerId}">${esc(ie.docNo)}</button>`]);}
    rows.push(['Tài khoản nhận',esc(f.bankAcc)||'<span class="sub">—</span>']);
  }
  if(p.type==='TU'){
    rows.push(['Số tiền tạm ứng',`<b class="num">${money(f.amount,f.currency)}</b>`]);
    rows.push(['Hạn hoàn ứng',`${fDate(f.dueBack)} ${p.status==='dachi'&&f.dueBack<today()?'<span class="pill st-over">Quá hạn</span>':''}`]);
    rows.push(['Tình trạng quyết toán',p.settle?`Đã quyết toán: dùng ${money(p.settle.used)}, hoàn lại ${money(p.settle.refund)}`:(p.status==='dachi'?'Chưa quyết toán':'—')]);
  }
  if(p.type!=='VT')rows.push(['Ghi chú',f.note?esc(f.note).replace(/\n/g,'<br>'):'<span class="sub">—</span>']);
  if(p.payCode)rows.push(['Phiếu chi',`<span class="code">${esc(p.payCode)}</span>`]);
  rows.push(['File đính kèm',(f.files&&f.files.length)?f.files.map(n=>`<div>📎 ${esc(n)}</div>`).join(''):'<span class="sub">Không có</span>']);

  const dot=(s,i)=>s.status==='duyet'?'<span class="dot done">✓</span>':(s.status==='tuchoi'||s.status==='tralai')?'<span class="dot bad">!</span>':(p.status==='cho'&&i===p.curStep?`<span class="dot now">${i+1}</span>`:`<span class="dot">${i+1}</span>`);
  const steps=p.steps.length?p.steps.map((s,i)=>`<li>${dot(s,i)}<div><b>${STEP_LABEL[s.role]}</b> <span class="sub">${esc(uname(s.role))}</span>
     <div class="sub">${s.status==='duyet'?'Đã duyệt '+fDT(s.at):s.status==='tuchoi'?'Từ chối '+fDT(s.at):s.status==='tralai'?'Trả lại '+fDT(s.at):(p.status==='cho'&&i===p.curStep?'Đang chờ duyệt':'Chưa tới lượt')}</div>
     ${s.note?`<div class="note-box">${esc(s.note)}</div>`:''}</div></li>`).join(''):'<li><span class="dot">·</span><div class="sub">Chưa gửi duyệt. Luồng duyệt sẽ được lập khi gửi.</div></li>';
  const preview=p.status==='nhap'?buildSteps(p).map(s=>STEP_LABEL[s.role]).join(' → '):'';
  return `
  <div class="head"><div><div class="crumb"><button data-act="go" data-v="proposals">Đề xuất</button> / ${TYPES[p.type]}</div>
    <h1>${esc(p.code)} · ${esc(p.title)}</h1><div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill(p.status)}<span class="sub">${esc(stepText(p))}</span></div></div>
    <div class="actions">${btns.join('')}</div></div>
  ${p.returned&&p.status==='nhap'?`<div class="alert warn"><b>Bị trả lại:</b> ${esc(p.returned)}</div>`:''}
  ${p.cancel&&p.status==='huy'?`<div class="alert bad"><b>Đã hủy</b> bởi ${esc(uname(p.cancel.by))} lúc ${fDT(p.cancel.at)}. Lý do: ${esc(p.cancel.reason)}. Dữ liệu vẫn được lưu; Admin có thể khôi phục.</div>`:''}
  ${['duyet','dachi','hoanthanh'].includes(p.status)?`<div class="alert info">Chứng từ đã duyệt: không ai sửa trực tiếp được. Muốn thay đổi thì lập đề xuất điều chỉnh.</div>`:''}
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>Thông tin đề xuất</h2></div><div class="panel-b"><dl class="dl">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></section>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <section class="panel"><div class="panel-h"><h2>Luồng duyệt</h2></div><div class="panel-b"><ol class="timeline">${steps}</ol>
        ${preview?`<div class="sub">Khi gửi, luồng sẽ là: <b>${preview||'duyệt tự động'}</b>${p.type!=='VT'?` (trên ${money(S.threshold)} cần Giám đốc)`:''}</div>`:''}</div></section>
      <section class="panel"><div class="panel-h"><h2>Lịch sử thao tác</h2></div><div class="panel-b"><ol class="timeline">
        ${p.history.slice().reverse().map(h=>`<li><span class="dot">·</span><div><b>${esc(h.action)}</b><div class="sub">${esc(uname(h.by))} · ${fDT(h.at)}</div>${h.note?`<div class="note-box">${esc(h.note)}</div>`:''}</div></li>`).join('')}
      </ol></div></section>
    </div>
  </div>`;
}

/* ---------- Công nợ ---------- */
const pById=id=>S.partners.find(x=>x.id===id);
function ageBar(B,rate){const tot=BUCKETS.reduce((t,[k])=>t+B[k]*(rate||1),0);if(tot<=0)return '<div class="agebar empty"></div>';
  return `<div class="agebar" role="img" aria-label="Tuổi nợ">${BUCKETS.map(([k,l])=>B[k]>0?`<i style="width:${Math.max(2,B[k]*(rate||1)/tot*100)}%;background:${BCOLOR[k]}" title="${l}: ${nf(B[k])}"></i>`:'').join('')}</div>`;}

function invPill(i){return i.status==='paid'?'<span class="pill st-hoanthanh">Đã thanh toán</span>':i.status==='over'?`<span class="pill st-tuchoi">Quá hạn ${i.days} ngày</span>`:i.status==='part'?'<span class="pill st-duyet">Trả một phần</span>':'<span class="pill st-nhap">Chưa thanh toán</span>';}
const dueText=i=>i.open<=0?'':i.days>0?`<span class="badc">quá ${i.days} ngày</span>`:i.days===0?'<span style="color:var(--amber);font-weight:600">đến hạn hôm nay</span>':`còn ${-i.days} ngày`;
const vndNote=(amt,p,rate)=>p.currency!=='VND'?`<div class="sub num">≈ ${money(amt*(rate||1))}</div>`:'';
/* nút hành động trên một hóa đơn còn nợ */
function invAction(p,i,sm){
  if(i.open<=0)return '';
  if(p.kind==='kh')return can.ledger()?`<button class="btn ${sm?'sm':''} pri" data-act="newPay" data-pid="${p.id}" data-inv="${i.e.id}">Ghi thu</button>`:'';
  return isRole('ktt','admin','tbp','nv')?`<button class="btn ${sm?'sm':''}" data-act="payProp" data-pid="${p.id}" data-inv="${i.e.id}">Đề nghị thanh toán</button>`:'';
}

    <button class="tile ${overVnd>0?'warn':''}" data-act="dview" data-v="aging"><span class="k">Đã quá hạn</span><span class="v num">${money(overVnd)}</span><span class="s">${totalVnd>0?Math.round(overVnd/totalVnd*100):0}% tổng nợ</span></button>
    <button class="tile ${soonVnd>0?'att':''}" data-act="dview" data-v="invoices" data-f="soon"><span class="k">Đến hạn 7 ngày tới</span><span class="v num">${money(soonVnd)}</span><span class="s">${isKH?'cần nhắc khách':'cần chuẩn bị tiền'}</span></button>
    <button class="tile" data-act="dview" data-v="aging"><span class="k">Tuổi nợ</span>${ageBar(totB,1)}<span class="s">bấm để xem báo cáo</span></button>
  </div>`;
  const tabs=`<div class="tabs scroll">${[['partners','Theo đối tác'],['invoices','Hóa đơn'],['aging','Tuổi nợ']].map(([k,v])=>`<button class="tab ${view===k?'on':''}" data-act="dview" data-v="${k}">${v}</button>`).join('')}</div>`;
  let body='';

      <div class="mcards">${list.map(({p,s})=>`<button class="mcard" data-act="partner" data-id="${p.id}"><span class="mc-top"><b>${esc(p.name)}</b>${s.overdue>0?'<span class="pill st-tuchoi">Quá hạn</span>':''}</span>
        <span class="mc-row"><span class="sub">Số dư</span><b class="num">${money(s.bal,p.currency)}</b></span>${s.overdue>0?`<span class="mc-row"><span class="sub">Quá hạn</span><b class="num badc">${money(s.overdue,p.currency)}</b></span>`:''}
        ${ageBar(s.B)}<span class="sub">${esc(p.code)} · hạn gần nhất ${fDate(s.nextDue)}</span></button>`).join('')}</div>`:'<div class="empty">Không có đối tác khớp bộ lọc.</div>'}
    <div class="panel-b">${ageLegend()}</div>`;
  }else if(view==='invoices'){
    const F={all:'Tất cả',open:'Chưa thanh toán',part:'Trả một phần',over:'Quá hạn',soon:'Đến hạn 7 ngày',paid:'Đã thanh toán'};

    const test={all:()=>true,open:x=>x.i.status==='open',part:x=>x.i.status==='part',over:x=>x.i.status==='over',soon:x=>x.i.open>0&&x.i.days<=0&&x.i.e.due<=in7,paid:x=>x.i.status==='paid'};
    const list=all.filter(test[fl]).filter(x=>!q||(x.i.e.docNo+' '+x.p.name+' '+x.i.e.desc).toLowerCase().includes(q)).sort((a,b)=>(b.i.open>0)-(a.i.open>0)||b.i.days-a.i.days);

      ${list.map(({p,i})=>`<tr><td class="code">${esc(i.e.docNo)}<div class="sub" style="font-weight:400">${esc(i.e.desc)}</div></td><td><button class="link" data-act="partner" data-id="${p.id}">${esc(p.name)}</button></td><td class="num">${fDate(i.e.date)}</td>

      <div class="mcards">${list.map(({p,i})=>`<div class="mcard"><span class="mc-top"><b class="code">${esc(i.e.docNo)}</b>${invPill(i)}</span><button class="link" data-act="partner" data-id="${p.id}" style="text-align:left">${esc(p.name)}</button>

function limitCell(p,s){if(!p.limit)return '<span class="sub">—</span>';const pct=Math.round(Math.max(0,s.bal)/p.limit*100);

function reconDoc(p,from,to){
  const es=S.ledger.filter(e=>e.partnerId===p.id&&!e.cancelled);const sg=e=>e.kind==='phatsinh'?1:-1;
  const open=r2(es.filter(e=>e.date<from).reduce((t,e)=>t+sg(e)*e.amount,0));
  const R=es.filter(e=>e.date>=from&&e.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
  const inc=r2(R.filter(e=>e.kind==='phatsinh').reduce((t,e)=>t+Number(e.amount),0)),dec=r2(R.filter(e=>e.kind==='thanhtoan').reduce((t,e)=>t+Number(e.amount),0));
  const close=r2(open+inc-dec);const isKH=p.kind==='kh';
  const owe=close>=0?(isKH?`${p.name} còn nợ Công ty Tín Đức`:`Công ty Tín Đức còn nợ ${p.name}`):(isKH?`Công ty Tín Đức đang giữ tiền trả trước của ${p.name}`:`${p.name} đang giữ tiền trả trước của Công ty Tín Đức`);
  return `<div class="recon-doc" id="reconDoc"><div style="text-align:center"><b style="font-size:15px">BIÊN BẢN ĐỐI CHIẾU CÔNG NỢ</b><div class="sub">Từ ngày ${fDate(from)} đến ngày ${fDate(to)}</div></div>
   <div class="fgrid" style="font-size:13px"><div><b>Bên A:</b> Công ty Tín Đức</div><div><b>Bên B:</b> ${esc(p.name)}${p.tax?` · MST ${esc(p.tax)}`:''}</div></div>
   <div class="tbl-wrap"><table class="compact"><thead><tr><th>Ngày</th><th>Chứng từ</th><th>Diễn giải</th><th class="r">Phát sinh tăng</th><th class="r">Thanh toán</th></tr></thead><tbody>
    <tr class="total"><td colspan="3">Số dư đầu kỳ</td><td class="r num" colspan="2">${money(open,p.currency)}</td></tr>
    ${R.map(e=>`<tr><td class="num">${fDate(e.date)}</td><td>${esc(e.docNo)}</td><td>${esc(e.desc)}</td><td class="r num">${e.kind==='phatsinh'?nf(e.amount):''}</td><td class="r num">${e.kind==='thanhtoan'?nf(e.amount):''}</td></tr>`).join('')||'<tr><td colspan="5" class="sub">Không có phát sinh trong kỳ</td></tr>'}
    <tr class="total"><td colspan="3">Cộng phát sinh</td><td class="r num">${nf(inc)}</td><td class="r num">${nf(dec)}</td></tr>
    <tr class="total"><td colspan="3">Số dư cuối kỳ</td><td class="r num" colspan="2">${money(close,p.currency)}</td></tr></tbody></table></div>
   <div>Tính đến ngày ${fDate(to)}, ${esc(owe)} số tiền: <b>${money(Math.abs(close),p.currency)}</b>.</div>
   <div class="fgrid sign"><div>Đại diện bên A<div class="sub">(ký, ghi rõ họ tên)</div></div><div>Đại diện bên B<div class="sub">(ký, ghi rõ họ tên)</div></div></div></div>`;
}

function addReport(o,d,by){
  const r={id:uid(),code:nextCode('SL'),orderId:o.id,stage:d.stage,ok:d.ok,ng:d.ng,defect:d.defect||'',cause:d.cause||'',workers:d.workers,shift:d.shift||'Ca 1',
    start:d.start||'',end:d.end||'',date:d.date||today(),by:by||S.role,at:nowISO(),status:'cho',reviewBy:null,reviewAt:null,note:''};
  S.prod.reports.push(r);hlog(o,`Báo sản lượng ${STAGES[d.stage].name}`,`${r.code}: đạt ${d.ok}, lỗi ${d.ng}`,by);return r;
}
function approveReport(r,by){
  const o=orderById(r.orderId),i=r.stage;
  r.status='duyet';r.reviewBy=by||S.role;r.reviewAt=nowISO();
  o.st[i].done+=r.ok;o.st[i].ng+=r.ng;
  if(i<STAGES.length-1)o.st[i+1].recv+=r.ok;
  if(r.ng>0){const pp=S.inv.items.find(x=>x.code==='BTP-LOI');if(pp)newV('NSX',{date:r.date,from:'SXOUT',to:'PHE',orderId:o.id,lines:[{itemId:pp.id,qty:r.ng}],note:`Tấm lỗi ${STAGES[i].name}: ${r.defect} (${r.code})`},by);}
  hlog(o,`Duyệt sản lượng ${STAGES[i].name}`,`${r.code}: đạt ${r.ok}${i<STAGES.length-1?' → bàn giao '+STAGES[i+1].name:' → chờ nhập kho'}, lỗi ${r.ng}`,by);
  if(o.st.every((s,k)=>wip(o,k)===0)&&o.st[0].recv===o.qty){o.status='chonhap';hlog(o,'Xong mọi công đoạn – chờ nhập kho thành phẩm','',by);}
}
/* dữ liệu mẫu sản xuất */
function seedProd(){
  const P={orders:[],reports:[],rates:{CH:15000,EP:20000,CC:8000,XE:12000,HT:10000},penalty:0,locked:[]};
  S.prod=P;const X=seedInv();
  const team=k=>WORKERS.filter(w=>w.team===k).map(w=>w.id);
  const run=(o,steps)=>steps.forEach(([i,ok,ng,days,appr,def])=>{const r=addReport(o,{stage:i,ok,ng,defect:ng?def||'Bong tách lớp':'',cause:ng?'Ghi nhận mẫu':'',workers:team(STAGES[i].k),date:addDays(-days),shift:'Ca 1'},'tt');if(appr)approveReport(r,'qd');});
  const IR=(o,days)=>{issueOrder(o,'tk',addDays(-days));orderCK(o).filter(v=>v.status==='gui').forEach(v=>recvV(v,'qd'));};
  const M=(...a)=>a.map(([it,q])=>({itemId:it.id,qty:q}));
  const o3=createOrder({product:'LVL',T:40,W:1220,L:2440,qty:20,due:addDays(-6),prio:2,mats:M([X.d1,30],[X.m1,40],[X.k2,90],[X.b1,20])},'qd');
  IR(o3,15);run(o3,[[0,20,0,14,1],[1,19,1,12,1,'Phồng rộp'],[2,19,0,10,1],[3,18,1,9,1,'Nứt / gãy'],[4,18,0,8,1]]);receiveFG(o3,'tk',addDays(-8));
  const o5=createOrder({product:'Plywood',T:12,W:1220,L:2440,qty:30,due:addDays(3),prio:2,mats:M([X.d2,20],[X.m1,60],[X.k1,70],[X.b1,25])},'qd');
  IR(o5,7);run(o5,[[0,30,0,6,1],[1,30,0,5,1],[2,30,0,4,1],[3,30,0,3,1],[4,30,0,2,1]]);
  const o4=createOrder({product:'LVL',T:30,W:1220,L:3000,qty:15,due:addDays(-2),prio:1,mats:M([X.d1,25],[X.m1,30],[X.k2,60],[X.b1,15])},'qd');
  IR(o4,5);run(o4,[[0,15,0,4,1],[1,5,0,1,1]]);
  const o1=createOrder({product:'LVL',T:48,W:1220,L:3950,qty:10,due:addDays(6),prio:1,note:'Ví dụ trong yêu cầu gốc',mats:M([X.d1,25],[X.m1,20],[X.k2,50],[X.b1,15])},'qd');
  IR(o1,6);run(o1,[[0,10,0,5,1],[1,7,1,3,1,'Bong tách lớp'],[2,4,0,2,1],[1,2,0,0,0],[3,3,0,0,0]]);
  const o6=createOrder({product:'Plywood',T:18,W:1220,L:2440,qty:50,due:addDays(10),prio:3,mats:M([X.d2,40],[X.m1,100],[X.k1,110],[X.b1,40])},'qd');
  issueOrder(o6,'tk');
  createOrder({product:'LVL',T:40,W:1220,L:2440,qty:12,due:addDays(14),prio:2,mats:M([X.d1,18],[X.m1,24],[X.k2,55])},'qd');
  seedInvExtra(X,o3);
}

/* việc cần xử lý của sản xuất/kho */
function prodTasks(){
  const T=[];const P=S.prod;
  if(isRole('qd')){const n=P.reports.filter(r=>r.status==='cho').length;if(n)T.push({title:`${n} phiếu sản lượng chờ duyệt`,sub:'Chỉ sản lượng đã duyệt mới bàn giao sang công đoạn sau và vào lương khoán',act:'go',v:'review',btn:'Duyệt'});}
  vNeedMe().forEach(v=>T.push({title:v.type==='KK'?`Duyệt kiểm kê ${v.code}`:`Xác nhận nhận hàng ${v.code}`,sub:v.type==='KK'?`${whName(v.from)} · ${v.lines.length} mặt hàng`:`${vEndT(v,'from')} → ${whName(v.to)} · ${v.lines.length} mặt hàng${v.orderId&&orderById(v.orderId)?' · '+orderById(v.orderId).code:''}`,act:'go',v:'phieuct',id:v.id,btn:'Mở phiếu'}));
  if(isRole('tk')){P.orders.filter(o=>o.status==='chovattu'&&toIssue(o).length).forEach(o=>T.push({title:`Xuất vật tư cho ${o.code}`,sub:spec(o)+` · ${o.qty} tấm · hạn ${fDate(o.due)}`,act:'go',v:'order',id:o.id,btn:'Mở lệnh'}));
    P.orders.filter(o=>o.status==='chonhap').forEach(o=>T.push({title:`Nhập kho thành phẩm ${o.code}`,sub:`${o.st[4].done} tấm đạt · ${spec(o)}`,act:'go',v:'order',id:o.id,btn:'Mở lệnh'}));}
  if(isRole('tt')){P.reports.filter(r=>r.status==='tralai'&&r.by==='tt'&&!r.seen).forEach(r=>{const o=orderById(r.orderId);T.push({title:`Phiếu ${r.code} bị trả lại`,sub:`${o.code} · ${STAGES[r.stage].name}: ${r.note}`,act:'go',v:'order',id:o.id,btn:'Xem'});});}
  return T;
}

/* --- Lệnh sản xuất: danh sách + bảng công đoạn --- */
function renderProd(){
  const O=S.prod.orders;
  const F={all:o=>o.status!=='huy',run:o=>o.status==='dangsx',late:late,mat:o=>o.status==='chovattu',fg:o=>o.status==='chonhap',done:o=>o.status==='hoanthanh',huy:o=>o.status==='huy'};
  const L={all:'Tất cả',run:'Đang làm',late:'Trễ hạn',mat:'Chờ vật tư',fg:'Chờ nhập kho',done:'Hoàn thành',huy:'Đã hủy'};
  const q=ui.pq.trim().toLowerCase();
  const match=o=>!q||[o.code,spec(o),o.note].join(' ').toLowerCase().includes(q);
  const nRev=S.prod.reports.filter(r=>r.status==='cho').length;
  const head=`<div class="head"><div><div class="crumb">Sản xuất</div><h1>Lệnh sản xuất</h1><div class="sub">Theo dõi 5 công đoạn Chuyền → Ép → Cắt cạnh → Xẻ → Hoàn thiện; mỗi lần bàn giao phải được quản đốc duyệt.</div></div>
    <div class="actions"><span class="seg2"><button class="${ui.pmode==='list'?'on':''}" data-act="pmode" data-m="list">Danh sách</button><button class="${ui.pmode==='board'?'on':''}" data-act="pmode" data-m="board">Bảng công đoạn</button></span>
    <button class="btn" data-act="go" data-v="review">Duyệt sản lượng (${nRev})</button><button class="btn" data-act="go" data-v="scan">Quét tem</button>
    ${can.createOrder()?'<button class="btn pri" data-act="newOrder">+ Tạo lệnh</button>':''}</div></div>`;
  if(ui.pmode==='board'){
    const live=O.filter(o=>['chovattu','dangsx','chonhap'].includes(o.status)&&match(o));
    const cols=[{name:'Chờ vật tư',f:o=>o.status==='chovattu'}].concat(STAGES.map((s,i)=>({name:s.name,f:o=>curStage(o)===i})),[{name:'Chờ nhập kho',f:o=>o.status==='chonhap'}]);
    return head+`<section class="panel"><div class="chips"><span class="sub">Lệnh đang chạy nằm ở công đoạn sớm nhất còn hàng dở dang.</span><input id="pq" placeholder="Tìm mã lệnh, quy cách" value="${esc(ui.pq)}"></div>
     <div class="board">${cols.map(c=>{const cs=live.filter(c.f).sort((a,b)=>a.due.localeCompare(b.due));return `<div class="col"><div class="col-h"><span>${c.name}</span><span class="n">${cs.length}</span></div>
     ${cs.map(o=>`<button class="card ${late(o)?'late':''}" data-act="go" data-v="order" data-id="${o.id}"><span class="top-line"><span class="code">${esc(o.code)}</span><span style="${late(o)?'color:var(--red);font-weight:600':''}">Hạn ${fDate(o.due).slice(0,5)}</span></span>
       <b style="font-size:13px">${esc(spec(o))}</b><span class="sub">${o.qty} tấm · lỗi ${totalNg(o)} · ${progress(o)}%</span>
       <span class="segbar">${STAGES.map((s,i)=>`<i title="${s.name}"><b style="width:${Math.round(stageRatio(o,i)*100)}%"></b></i>`).join('')}</span></button>`).join('')||'<span class="sub">Trống</span>'}</div>`;}).join('')}</div></section>`;
  }
  const list=O.filter(F[ui.pf]||F.all).filter(match).sort((a,b)=>(late(b)-late(a))||a.due.localeCompare(b.due));
  return head+`<section class="panel"><div class="chips">${Object.keys(F).map(k=>`<button class="chip ${ui.pf===k?'on':''} ${k==='late'?'red':''}" data-act="pf" data-f="${k}">${L[k]}<b>${O.filter(F[k]).length}</b></button>`).join('')}
    <input id="pq" placeholder="Tìm mã lệnh, quy cách" value="${esc(ui.pq)}"></div>
    ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Lệnh sản xuất</th><th class="r">Số lượng</th><th>Công đoạn</th><th>Tiến độ</th><th class="r">Lỗi</th><th>Ưu tiên</th><th>Hạn</th><th>Trạng thái</th></tr></thead><tbody>
    ${list.map(o=>{const c=curStage(o);return `<tr class="click" data-act="go" data-v="order" data-id="${o.id}"><td><b>${esc(spec(o))}</b><div class="code" style="font-size:12px">${esc(o.code)}</div></td>
      <td class="r num">${o.qty} tấm</td><td>${c>=0?STAGES[c].name:o.status==='chonhap'||o.status==='hoanthanh'?'Xong':'—'}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${progress(o)}%"></i></div><span class="num sub">${progress(o)}%</span></div></td>
      <td class="r num ${totalNg(o)?'badc':''}">${totalNg(o)}</td><td>${['','Cao','Thường','Thấp'][o.prio]}</td>
      <td class="num" style="${late(o)?'color:var(--red);font-weight:600':''}">${fDate(o.due)}</td><td>${opill(o.status)}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty">Không có lệnh khớp bộ lọc.</div>'}</section>`;
}

/* --- Chi tiết lệnh --- */
function renderOrder(){
  const o=orderById(ui.id);if(!o)return '<div class="alert bad">Không tìm thấy lệnh sản xuất.</div>';
  const c=curStage(o);const btn=[];
  btn.push(`<button class="btn" data-act="tem" data-id="${o.id}">Tem QR</button>`);
  if(can.report(o))btn.push(`<button class="btn pri" data-act="report" data-id="${o.id}">Báo sản lượng</button>`);
  if(can.stock()&&o.status==='chovattu'&&toIssue(o).length)btn.push(`<button class="btn pri" data-act="issue" data-id="${o.id}">Xuất vật tư</button>`);
  {const pv=orderCK(o).find(v=>v.status==='gui'&&vCan.recv(v));if(pv)btn.push(`<button class="btn pri" data-act="go" data-v="phieuct" data-id="${pv.id}">Xác nhận nhận vật tư</button>`);}
  if(can.stock()&&o.status==='chonhap')btn.push(`<button class="btn pri" data-act="receive" data-id="${o.id}">Nhập kho thành phẩm</button>`);
  if(isRole('qd','admin')&&o.status==='chovattu')btn.push(`<button class="btn danger" data-act="cancelOrder" data-id="${o.id}">Hủy lệnh</button>`);
  if(isRole('admin')&&o.status==='huy')btn.push(`<button class="btn" data-act="restoreOrder" data-id="${o.id}">Khôi phục</button>`);
  const reps=S.prod.reports.filter(r=>r.orderId===o.id).sort((a,b)=>b.at.localeCompare(a.at));
  const sumWip=o.st.reduce((t,s,i)=>t+wip(o,i),0), fg=o.st[4].done, ng=totalNg(o), into=o.st[0].recv;
  const balanced=into===0||into===fg+ng+sumWip;
  const stageCards=STAGES.map((s,i)=>{const st=o.st[i],p=pendingQty(o,i),w=wip(o,i);const ok=st.recv===st.done+st.ng+w;
    return `<div class="stage ${i===c?'cur':''}"><h4><span>${s.name}</span><span class="${ok?'okc':'badc'}">${ok?'cân ✓':'lệch'}</span></h4>
      <div class="kv"><span>Nhận</span><b class="num">${st.recv}</b><span>Đạt, đã bàn giao</span><b class="num">${st.done}</b><span>Lỗi / hỏng</span><b class="num ${st.ng?'badc':''}">${st.ng}</b><span>Dở dang</span><b class="num">${w}</b>${p?`<span>Chờ duyệt</span><b class="num" style="color:var(--amber)">${p}</b>`:''}</div>
      <div class="bar"><i style="width:${Math.round(stageRatio(o,i)*100)}%;background:var(--green)"></i></div></div>`;}).join('');
  const tabs={rep:`Sản lượng (${reps.length})`,mat:`Vật tư (${o.mats.length})`,ng:`Lỗi (${reps.filter(r=>r.ng>0&&r.status==='duyet').length})`,his:'Lịch sử'};
  let body='';
  if(ui.otab==='rep'||ui.otab==='ng'){
    const rs=ui.otab==='ng'?reps.filter(r=>r.ng>0&&r.status==='duyet'):reps;
    body=rs.length?`<div class="tbl-wrap"><table><thead><tr><th>Phiếu</th><th>Công đoạn</th><th class="r">Đạt</th><th class="r">Lỗi</th><th>Lỗi / nguyên nhân</th><th>Người thực hiện</th><th>Ngày, ca</th><th>Trạng thái</th></tr></thead><tbody>
      ${rs.map(r=>`<tr><td class="code">${esc(r.code)}</td><td>${STAGES[r.stage].name}</td><td class="r num">${r.ok}</td><td class="r num ${r.ng?'badc':''}">${r.ng}</td>
      <td>${r.ng?esc(r.defect)+(r.cause?`<div class="sub">${esc(r.cause)}</div>`:''):'<span class="sub">—</span>'}</td><td>${r.workers.map(wname).map(esc).join(', ')}<div class="sub">báo bởi ${esc(uname(r.by))}</div></td>
      <td class="num">${fDate(r.date)} · ${esc(r.shift)}${r.start?`<div class="sub">${esc(r.start)}–${esc(r.end)}</div>`:''}</td><td>${rpill(r.status)}${r.note?`<div class="sub">${esc(r.note)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có phiếu.</div>';
  }else if(ui.otab==='mat'){
    const vs=S.inv.vouchers.filter(v=>v.orderId===o.id);
    body=`<div class="tbl-wrap"><table><thead><tr><th>Vật tư</th><th class="r">Định mức lệnh</th><th class="r">Đã chuyển xưởng</th><th class="r">Tồn kho mặc định</th><th>Trạng thái</th></tr></thead><tbody>
      ${o.mats.map(m=>{const it=itemById(m.itemId)||{};const sent=sentQty(o,m.itemId),h=onHand(it.wh,it.id);
        const st=sent>=m.qty?(orderCK(o).some(v=>v.status==='gui'&&v.lines.some(l=>l.itemId===it.id))?'<span class="pill st-cho">Chờ xưởng nhận</span>':'<span class="okc">Xưởng đã nhận</span>'):(h>=m.qty-sent?'Đủ tồn, chờ xuất':'<span class="badc">Thiếu tồn</span>');
        return `<tr><td>${esc(it.name)}<div class="sub">${esc(it.code)}</div></td><td class="r num">${nf(m.qty)} ${esc(it.unit)}</td><td class="r num">${nf(sent)}</td><td class="r num">${nf(h)} <span class="sub">${esc(whName(it.wh))}</span></td><td>${st}</td></tr>`;}).join('')}</tbody></table></div>
      ${vs.length?`<div class="panel-b" style="border-top:1px solid var(--line)"><b>Phiếu kho của lệnh</b><div class="recon" style="margin-top:8px">${vs.map(v=>`<button class="btn sm" data-act="go" data-v="phieuct" data-id="${v.id}">${esc(v.code)} · ${esc(VT[v.type].name)} · ${VST[v.status][0]}</button>`).join('')}</div></div>`:''}`;
  }else{
    body=`<div class="panel-b"><ol class="timeline">${o.history.slice().reverse().map(h=>`<li><span class="dot">·</span><div><b>${esc(h.action)}</b><div class="sub">${esc(uname(h.by))} · ${fDT(h.at)}</div>${h.note?`<div class="note-box">${esc(h.note)}</div>`:''}</div></li>`).join('')}</ol></div>`;
  }
  return `<div class="head"><div><div class="crumb"><button data-act="go" data-v="prod">Lệnh sản xuất</button> / ${esc(o.code)}</div>
    <h1>${esc(spec(o))} · ${o.qty} tấm</h1>
    <div style="margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${opill(o.status)}<span class="code">${esc(o.code)}</span><span class="sub" style="${late(o)?'color:var(--red);font-weight:600':''}">Hạn ${fDate(o.due)}${late(o)?` · trễ ${daysBetween(o.due,today())} ngày`:''}</span><span class="sub">Phụ trách: ${esc(uname(o.owner))}</span></div></div>
    <div class="actions">${btn.join('')}</div></div>
  ${o.status==='huy'?`<div class="alert bad"><b>Đã hủy</b> bởi ${esc(uname(o.cancel.by))} lúc ${fDT(o.cancel.at)}. Lý do: ${esc(o.cancel.reason)}.</div>`:''}
  ${o.note?`<div class="alert info">${esc(o.note)}</div>`:''}
  <section class="panel"><div class="panel-h"><h2>Tiến độ ${progress(o)}% · bàn giao giữa công đoạn</h2>
    <div class="recon"><span>Đưa vào: <b class="num">${into}</b></span><span>Thành phẩm: <b class="num">${fg}</b></span><span>Lỗi: <b class="num">${ng}</b></span><span>Dở dang: <b class="num">${sumWip}</b></span>
    <span class="${balanced?'okc':'badc'}">${balanced?'Đối chiếu khớp: vào = thành phẩm + lỗi + dở dang':'Lệch số lượng – cần kiểm tra'}</span></div></div>
    <div class="panel-b"><div class="stagegrid">${stageCards}</div></div></section>
  <section class="panel"><div class="tabs">${Object.entries(tabs).map(([k,v])=>`<button class="tab ${ui.otab===k?'on':''}" data-act="otab" data-t="${k}">${v}</button>`).join('')}</div>${body}</section>`;
}

  const recent=S.prod.reports.filter(r=>r.status!=='cho').sort((a,b)=>(b.reviewAt||'').localeCompare(a.reviewAt||'')).slice(0,8);
  const row=r=>{const o=orderById(r.orderId);const money_=r.ok*(S.prod.rates[STAGES[r.stage].k]||0);

/* --- biểu đồ cột --- */
function bars(data,o={}){
  const w=640,h=o.h||220,pl=48,pb=34,pt=16,pr=8,max=Math.max(1,...data.map(d=>d.v));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step)*step;const ih=h-pb-pt,bw=(w-pl-pr)/Math.max(1,data.length);
  const ticks=[0,1,2,3,4].map(i=>top*i/4);const fmt=o.fmt||(v=>nf(v));
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label||'Biểu đồ')}">
   ${ticks.map(t=>{const y=pt+ih-(t/top)*ih;return `<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${o.tick?o.tick(t):nf(t)}</text>`;}).join('')}
   ${data.map((d,i)=>{const bh=(d.v/top)*ih,x=pl+i*bw+bw*.2,y=pt+ih-bh;return `<rect x="${x}" y="${y}" width="${bw*.6}" height="${Math.max(0,bh)}" rx="3" fill="${d.c||o.color||'var(--accent)'}"><title>${esc(d.l)}: ${fmt(d.v)}</title></rect>
     ${data.length<=16&&d.v>0?`<text x="${x+bw*.3}" y="${y-4}" text-anchor="middle" font-size="11" fill="var(--fg)">${fmt(d.v)}</text>`:''}
     <text x="${x+bw*.3}" y="${h-pb+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(d.l)}</text>`;}).join('')}
  </svg>`;
}

/* --- Chấm công --- */
function attCell(e,date){
  const a=S.hr.adj[e.id+'|'+date];if(a)return {code:a.code,ot:a.ot,adj:a};
  if(date>today()||date<e.start||e.status==='Đã nghỉ việc')return {code:'',ot:0};
  if(new Date(date+'T00:00:00').getDay()===0)return {code:'CN',ot:0};
  if(e.status==='Nghỉ phép'&&date>=addDays(-4))return {code:'P',ot:0};
  const r=hsh(e.id+date)%100;if(r<3)return {code:'P',ot:0};if(r<5)return {code:'KL',ot:0};
  return {code:'X',ot:hsh(date+e.id)%100<15?2:0};
}
function attSum(e,m){const s={x:0,p:0,kl:0,ot:0};for(let d=1;d<=daysIn(m);d++){const c=attCell(e,`${m}-${pad(d)}`);if(c.code==='X')s.x++;if(c.code==='P')s.p++;if(c.code==='KL')s.kl++;s.ot+=Number(c.ot)||0;}return s;}

function khoanMap(m){const R=S.prod.rates,pen=S.prod.penalty||0,M={};
  S.prod.reports.filter(r=>r.status==='duyet'&&monthOf(r.date)===m).forEach(r=>{const sh=1/r.workers.length;r.workers.forEach(w=>{M[w]=(M[w]||0)+(r.ok*(R[STAGES[r.stage].k]||0)-r.ng*pen)*sh;});});return M;}
function payRows(m){const K=khoanMap(m);
  return S.hr.emps.filter(e=>e.status!=='Đã nghỉ việc'&&e.start<=`${m}-31`).map(e=>{const a=attSum(e,m),day=e.base/26;
    const r={e,x:a.x,p:a.p,ot:a.ot,byDay:Math.round(day*(a.x+a.p)),otPay:Math.round(day/8*1.5*a.ot),allow:e.allow,khoan:Math.round(K[e.wid]||0),bonus:S.hr.bonus[m+'|'+e.id]||0,bh:Math.round(e.base*0.105)};
    r.net=r.byDay+r.otPay+r.allow+r.khoan+r.bonus-r.bh;return r;});}

/* --- Báo cáo sản xuất --- */
function prodStats(days){
  const from=addDays(-(days-1));const R=S.prod.reports.filter(r=>r.status==='duyet'&&r.date>=from);
  const byDay=Array.from({length:days},(_,i)=>{const d=addDays(-(days-1-i));return {l:d.slice(8)+'/'+d.slice(5,7),v:R.filter(r=>r.date===d&&r.stage===4).reduce((t,r)=>t+r.ok,0)};});
  const byStage=STAGES.map((s,i)=>{const rs=R.filter(r=>r.stage===i);const ok=rs.reduce((t,r)=>t+r.ok,0),ng=rs.reduce((t,r)=>t+r.ng,0);return {s,ok,ng,rate:ok+ng?ng/(ok+ng)*100:0};});
  const defects={};R.filter(r=>r.ng).forEach(r=>defects[r.defect]=(defects[r.defect]||0)+r.ng);
  const wipBy=STAGES.map((s,i)=>S.prod.orders.filter(o=>o.status==='dangsx').reduce((t,o)=>t+wip(o,i),0));
  return {R,byDay,byStage,defects,wipBy};
}

const lineRow=l=>`<div class="line-row"><input aria-label="Tên vật tư" data-k="ten" value="${esc(l.ten)}"><input aria-label="Quy cách" data-k="quycach" value="${esc(l.quycach)}"><input aria-label="Số lượng" data-k="sl" type="number" min="0" step="any" value="${esc(l.sl)}"><input aria-label="Đơn vị tính" data-k="dvt" value="${esc(l.dvt)}"><button type="button" class="btn sm" data-act="delLine" aria-label="Xóa dòng">×</button></div>`;
/* số tiền trong ô nhập: 10000 -> 10.000 ; phần thập phân dùng dấu phẩy */
const parseMoneyIn=v=>{const s=String(v==null?'':v).replace(/\./g,'').replace(/\s/g,'').replace(',','.');return s===''?NaN:Number(s);};
function fmtMoneyIn(v){if(v===''||v==null)return '';let s=String(v);if(typeof v==='number')s=String(v).replace('.',',');
  s=s.replace(/[^\d,]/g,'');const i=s.indexOf(',');let a=i<0?s:s.slice(0,i),b=i<0?null:s.slice(i+1).replace(/,/g,'');
  a=a.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');return b===null?a:a+','+b;}
const moneyFields=f=>`<div class="f"><label for="amount">Số tiền <span class="req">*</span></label><input id="amount" name="amount" class="money-in" type="text" inputmode="decimal" autocomplete="off" value="${esc(fmtMoneyIn(f.amount))}" placeholder="VD: 10.000"></div>

  <div class="f"><label for="rate">Tỷ giá (khi USD)</label><input id="rate" name="rate" class="money-in" type="text" inputmode="decimal" autocomplete="off" value="${esc(f.currency==='USD'?fmtMoneyIn(f.rate):'')}" placeholder="VD: 25.400"></div>`;

function openProposal(type,p,preset){
  let t=p?p.type:(type||'VT');
  const draw=()=>{openModal(p?`Sửa ${p.code}`:'Tạo đề xuất',proposalForm(t,p,preset),
    `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn" name="mode" value="draft">Lưu nháp</button><button type="submit" class="btn pri" name="mode" value="send">Lưu và gửi duyệt</button>`,
    (fd,submitter)=>saveProposal(t,p,fd,submitter&&submitter.value));
    MODAL.switchType=nt=>{t=nt;draw();};};
  draw();
}
function saveProposal(t,p,fd,mode){
  clearErr();let ok=true;
  const title=(fd.get('title')||'').trim();if(!title){fieldErr('title','Nhập nội dung.');ok=false;}
  const fields={files:p?p.fields.files:[]};
  const fileList=$('#files').files;if(fileList&&fileList.length)fields.files=Array.from(fileList).map(x=>x.name);
  if(t==='VT'){
    fields.lines=$$('#lines .line-row').map(r=>({ten:r.querySelector('[data-k=ten]').value.trim(),quycach:r.querySelector('[data-k=quycach]').value.trim(),sl:r.querySelector('[data-k=sl]').value,dvt:r.querySelector('[data-k=dvt]').value.trim()})).filter(l=>l.ten||l.sl);
    if(!fields.lines.length||fields.lines.some(l=>!l.ten||!(Number(l.sl)>0)||!l.dvt)){fieldErr('lines','Mỗi dòng cần tên, số lượng > 0 và ĐVT.');ok=false;}
    fields.purpose=(fd.get('purpose')||'').trim();if(!fields.purpose){fieldErr('purpose','Nhập mục đích.');ok=false;}
    fields.needBy=fd.get('needBy')||'';if(!fields.needBy){fieldErr('needBy','Chọn ngày cần.');ok=false;}
  }else{
    fields.amount=parseMoneyIn(fd.get('amount'));if(!(fields.amount>0)){fieldErr('amount','Số tiền phải lớn hơn 0.');ok=false;}
    fields.currency=fd.get('currency')||'VND';fields.rate=fields.currency==='USD'?parseMoneyIn(fd.get('rate')):1;
    if(fields.currency==='USD'&&!(fields.rate>0)){fieldErr('rate','Nhập tỷ giá.');ok=false;}
    fields.note=(fd.get('note')||'').trim();
    if(t==='TT'){fields.partnerId=fd.get('partnerId')||'';fields.partnerText=(fd.get('partnerText')||'').trim();fields.bankAcc=(fd.get('bankAcc')||'').trim();
      if(!fields.partnerId&&!fields.partnerText){fieldErr('partnerText','Chọn NCC hoặc nhập tên đối tượng.');ok=false;}
      const pt=fields.partnerId&&S.partners.find(x=>x.id===fields.partnerId);if(pt&&pt.currency!==fields.currency){fieldErr('currency',`NCC này ghi công nợ bằng ${pt.currency}.`);ok=false;}
      fields.invId=fields.partnerId?(fd.get('invId')||''):'';
      if(fields.invId){const i=allocate(fields.partnerId).inv.find(x=>x.e.id===fields.invId);if(i&&fields.amount>i.open+1e-9){fieldErr('amount',`Hóa đơn ${i.e.docNo} chỉ còn nợ ${money(i.open,pt.currency)}.`);ok=false;}}}
    if(t==='TU'){fields.dueBack=fd.get('dueBack')||'';if(!fields.dueBack){fieldErr('dueBack','Chọn hạn hoàn ứng.');ok=false;}}
  }
  if(!ok)return false;
  if(p){
    const before=JSON.stringify({title:p.title,...p.fields});p.title=title;p.fields=fields;
    const changed=before!==JSON.stringify({title,...fields});
    hist(p,'Sửa đề xuất',changed?'Đã thay đổi nội dung (bản cũ được lưu trong lịch sử phiên bản)':'Không có thay đổi');
    if(p.status==='cho'&&mode!=='send'){p.status='nhap';p.steps=[];p.curStep=0;hist(p,'Thu hồi về nháp','Sửa khi chưa có cấp nào duyệt; cần gửi duyệt lại');}
    log('Sửa đề xuất',p.code);
  }else{
    p={id:uid(),code:nextCode(t),type:t,title,createdBy:S.role,dept:USERS[S.role].dept,createdAt:nowISO(),status:'nhap',steps:[],curStep:0,fields,history:[],cancel:null,returned:null,payCode:null,settle:null};
    S.proposals.push(p);hist(p,'Tạo đề xuất');log('Tạo đề xuất',p.code);
  }
  if(mode==='send')doSubmit(p);
  save();closeModal();go('detail',p.id);toast(mode==='send'?`Đã gửi duyệt ${p.code}`:`Đã lưu nháp ${p.code}`);
  return true;
}
function doSubmit(p){
  p.steps=buildSteps(p);p.curStep=0;p.returned=null;
  p.status=p.steps.length?'cho':'duyet';
  hist(p,'Gửi duyệt',p.steps.length?'Luồng: '+p.steps.map(s=>STEP_LABEL[s.role]).join(' → '):'Không cần cấp duyệt');log('Gửi duyệt',p.code);
}
