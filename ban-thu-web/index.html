     const rate=pt.currency==='VND'?1:Number(fd.get('rate'));if(!(rate>0)){fieldErr('rate','Đối tác dùng ngoại tệ: nhập tỷ giá.');ok=false;}
     if(!ok)return false;
     const amount=invTotal(net,vat,pt.currency);const f=$('#ifile').files;
     S.ledger.push({id:uid(),partnerId:pt.id,kind:'phatsinh',date:fd.get('date'),due:fd.get('due'),docNo:'HĐ '+doc.replace(/^HĐ\s*/,''),desc:(fd.get('desc')||'').trim(),net,vatRate:vat==='KCT'?'KCT':Number(vat),amount,rate,ref:'',files:f&&f.length?[f[0].name]:[],cancelled:null,by:S.role,at:nowISO()});
     log('Ghi hóa đơn',`${pt.code} · ${doc} · ${money(amount,pt.currency)}`);save();closeModal();ui.ptab='inv';go('partner',pt.id);toast('Đã ghi sổ hóa đơn');return true;});
  syncInvoiceForm();
}
function syncInvoiceForm(){const pt=pById(($('#ipartner')||{}).value);if(!pt)return;
  const net=Number($('#inet').value)||0,vat=$('#ivat').value;const tot=invTotal(net,vat,pt.currency);
  $('#itotal').textContent=net?money(tot,pt.currency):'—';$('#irateBox').hidden=pt.currency==='VND';
  const d=$('#idate').value;if(d&&!$('#idue').dataset.touched){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+(pt.term||30));$('#idue').value=ymd(x);}
  $('#iduehint').textContent=`Mặc định ${pt.term||30} ngày theo hạn thanh toán của đối tác`;}

/* Ghi thu (khách hàng trả tiền): phân bổ vào từng hóa đơn */
function openPay(pid,invId){
  const p0=pid?pById(pid):S.partners.find(x=>x.kind==='kh');
  openModal('Ghi phiếu thu',`<div class="fgrid">
    <div class="f full"><label for="ppartner">Khách hàng <span class="req">*</span></label>${partnerSelect('kh',p0.id,'ppartner')}</div>
    <div class="f"><label for="pdate">Ngày thu <span class="req">*</span></label><input id="pdate" name="date" type="date" value="${today()}"></div>
    <div class="f"><label for="pamt">Số tiền thu <span class="req">*</span></label><input id="pamt" name="amount" type="number" min="0" step="any" inputmode="decimal"></div>
    <div class="f"><label for="pmethod">Hình thức</label><select id="pmethod" name="method"><option>Chuyển khoản</option><option>Tiền mặt</option><option>Bù trừ công nợ</option></select></div>
    <div class="f"><label for="pref">Số chứng từ ngân hàng / biên nhận</label><input id="pref" name="bankRef"></div>
    <div class="f" id="prateBox"><label for="prate">Tỷ giá ngày thu <span class="req">*</span></label><input id="prate" name="rate" type="number" min="0" step="any" inputmode="decimal"></div>
    <div class="f full"><label>Trả cho hóa đơn</label><div id="pallocs"></div><input type="hidden" name="alloc"></div></div>`,
   `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn pri">Ghi phiếu thu</button>`,
   fd=>{clearErr();let ok=true;const pt=pById(fd.get('partner'));const amount=Number(fd.get('amount'));
     if(!(amount>0)){fieldErr('amount','Số tiền phải lớn hơn 0.');ok=false;}if(!fd.get('date')){fieldErr('date','Chọn ngày.');ok=false;}
     const rate=pt.currency==='VND'?1:Number(fd.get('rate'));if(!(rate>0)){fieldErr('rate','Nhập tỷ giá.');ok=false;}
     const A=allocate(pt.id);const alloc=$$('#pallocs [data-al]').map(x=>({invId:x.dataset.al,amount:Number(x.value)||0})).filter(a=>a.amount>0);
     for(const a of alloc){const i=A.inv.find(x=>x.e.id===a.invId);if(a.amount>i.open+1e-9){fieldErr('alloc',`Hóa đơn ${i.e.docNo} chỉ còn ${nf(i.open)}.`);ok=false;}}
     const sumA=r2(alloc.reduce((t,a)=>t+a.amount,0));if(ok&&sumA>amount){fieldErr('alloc','Tổng phân bổ lớn hơn số tiền thu.');ok=false;}
     if(!ok)return false;
     const code=nextCode('PT');const ref=(fd.get('bankRef')||'').trim();
     S.ledger.push({id:uid(),partnerId:pt.id,kind:'thanhtoan',date:fd.get('date'),due:'',docNo:code,desc:'Khách thanh toán'+(ref?' – '+ref:''),amount,rate,method:fd.get('method'),bankRef:ref,alloc,ref:'',cancelled:null,by:S.role,at:nowISO()});
     log('Ghi phiếu thu',`${code} · ${pt.code} · ${money(amount,pt.currency)}`);save();closeModal();ui.ptab='pay';go('partner',pt.id);
     toast(sumA<amount?`Đã ghi ${code}; ${money(r2(amount-sumA),pt.currency)} chưa phân bổ, tự trừ vào hóa đơn cũ nhất`:`Đã ghi ${code}`);return true;});
  ui.payInv=invId||'';syncPayForm(true);
}
function syncPayForm(rebuild){const pt=pById(($('#ppartner')||{}).value);if(!pt)return;$('#prateBox').hidden=pt.currency==='VND';
  const A=allocate(pt.id);const open=A.inv.filter(i=>i.open>0);
  if(rebuild){$('#pallocs').innerHTML=open.length?`<div class="alloc">${open.map(i=>`<label class="alloc-r"><span><b>${esc(i.e.docNo)}</b><span class="sub"> · hạn ${fDate(i.e.due)} · còn ${money(i.open,pt.currency)}</span>${i.days>0?` <span class="badc">quá ${i.days} ngày</span>`:''}</span>
      <input type="number" min="0" step="any" inputmode="decimal" data-al="${i.e.id}" data-open="${i.open}" aria-label="Phân bổ cho ${esc(i.e.docNo)}" value="${ui.payInv===i.e.id?i.open:''}"></label>`).join('')}
      <div class="alloc-f"><button type="button" class="btn sm" data-act="autoAlloc">Tự phân bổ (hóa đơn cũ trước)</button><span class="sub" id="psum"></span></div></div>`:'<div class="sub">Khách không còn hóa đơn nào đang nợ: số tiền sẽ ghi nhận là trả trước.</div>';
    if(ui.payInv){const i=open.find(x=>x.e.id===ui.payInv);if(i)$('#pamt').value=i.open;}}
  const sum=r2($$('#pallocs [data-al]').reduce((t,x)=>t+(Number(x.value)||0),0)),amt=Number($('#pamt').value)||0;const ps=$('#psum');
  if(ps)ps.innerHTML=`Đã phân bổ <b class="num">${money(sum,pt.currency)}</b> / ${money(amt,pt.currency)}${amt>sum?` · dư ${money(r2(amt-sum),pt.currency)} tự trừ hóa đơn cũ nhất`:''}${sum>amt?' · <span class="badc">vượt số tiền thu</span>':''}`;}

/* Thêm / sửa đối tác */
function editPartner(id){
  const p=id?pById(id):null;const kind=p?p.kind:ui.debtTab;
  openModal(p?'Sửa đối tác':(kind==='kh'?'Thêm khách hàng':'Thêm nhà cung cấp'),`<div class="fgrid">
    <div class="f full"><label for="ep-name">Tên <span class="req">*</span></label><input id="ep-name" name="name" value="${esc(p?p.name:'')}"></div>
    <div class="f"><label for="ep-tax">Mã số thuế</label><input id="ep-tax" name="tax" inputmode="numeric" value="${esc(p?p.tax||'':'')}"></div>
    <div class="f"><label for="ep-cur">Tiền tệ công nợ</label><select id="ep-cur" name="currency" ${p?'disabled':''}><option ${p&&p.currency==='VND'?'selected':''}>VND</option><option ${p&&p.currency==='USD'?'selected':''}>USD</option></select></div>
    <div class="f"><label for="ep-term">Hạn thanh toán (ngày)</label><input id="ep-term" name="term" type="number" min="0" value="${p?p.term||30:30}"></div>
    ${kind==='kh'?`<div class="f"><label for="ep-limit">Hạn mức công nợ</label><input id="ep-limit" name="limit" type="number" min="0" value="${p?p.limit||'':''}"></div>`:''}
    <div class="f"><label for="ep-contact">Người liên hệ</label><input id="ep-contact" name="contact" value="${esc(p?p.contact||'':'')}"></div>
    <div class="f"><label for="ep-phone">Điện thoại</label><input id="ep-phone" name="phone" type="tel" value="${esc(p?p.phone||'':'')}"></div>
    <div class="f full"><label for="ep-addr">Địa chỉ</label><input id="ep-addr" name="addr" value="${esc(p?p.addr||'':'')}"></div></div>`,null,
   fd=>{const n=(fd.get('name')||'').trim();if(!n){fieldErr('name','Nhập tên.');return false;}
     const tax=(fd.get('tax')||'').trim();if(tax&&!/^\d{10}(-\d{3})?$/.test(tax)){fieldErr('tax','Mã số thuế gồm 10 số (hoặc 10 số-3 số).');return false;}
     const data={name:n,tax,term:Number(fd.get('term'))||30,limit:Number(fd.get('limit'))||0,contact:(fd.get('contact')||'').trim(),phone:(fd.get('phone')||'').trim(),addr:(fd.get('addr')||'').trim()};
     if(p){Object.assign(p,data);log('Sửa thông tin đối tác',p.code);}else{const pre=kind==='ncc'?'NCC':'KH';const num=S.partners.filter(x=>x.kind===kind).length+1;
       const np={id:uid(),code:`${pre}-${String(num).padStart(3,'0')}`,kind,currency:fd.get('currency'),recons:[],...data};S.partners.push(np);log('Thêm đối tác',np.code);ui.id=np.id;}
     save();closeModal();if(p)render();else go('partner',ui.id);toast('Đã lưu');return true;});
}
function invOptions(pid,sel){if(!pid)return '<option value="">— Chọn NCC trước —</option>';const pt=pById(pid);
  const open=allocate(pid).inv.filter(i=>i.open>0);
  return `<option value="">— Trừ vào hóa đơn cũ nhất —</option>`+open.map(i=>`<option value="${i.e.id}" data-open="${i.open}" ${sel===i.e.id?'selected':''}>${esc(i.e.docNo)} · còn ${money(i.open,pt.currency)}${i.days>0?' · quá hạn':''}</option>`).join('');}

const A={
  go:d=>{if(d.status!==undefined){ui.f={type:'',status:d.status,q:''};ui.page=1;}if(d.tab)ui.debtTab=d.tab;if(d.pf){ui.pf=d.pf;ui.pmode='list';}go(d.v,d.name||d.id||null);},

  partner:d=>go('partner',d.id),

  submit:d=>{const p=P(d.id);if(!can.submit(p))return;doSubmit(p);save();render();toast(`Đã gửi duyệt ${p.code}`);},
  approve:d=>{const p=P(d.id);askReason(`Duyệt ${p.code}`,'Ý kiến (không bắt buộc)',false,note=>{
      if(!can.approve(p))return;const st=p.steps[p.curStep];st.status='duyet';st.by=S.role;st.at=nowISO();st.note=note;
      hist(p,`Duyệt (${STEP_LABEL[st.role]})`,note);log('Duyệt',p.code);p.curStep++;if(p.curStep>=p.steps.length)p.status='duyet';

  reject:d=>{const p=P(d.id);askReason(`Từ chối ${p.code}`,'Lý do từ chối',true,note=>{
      const st=p.steps[p.curStep];st.status='tuchoi';st.by=S.role;st.at=nowISO();st.note=note;p.status='tuchoi';
      hist(p,`Từ chối (${STEP_LABEL[st.role]})`,note);log('Từ chối',p.code);save();closeModal();render();toast('Đã từ chối');},'Từ chối',true);},
  return:d=>{const p=P(d.id);askReason(`Trả lại ${p.code}`,'Cần bổ sung / sửa gì',true,note=>{
      const st=p.steps[p.curStep];st.status='tralai';st.by=S.role;st.at=nowISO();st.note=note;p.status='nhap';p.returned=`${note} — ${uname(S.role)}`;
      hist(p,`Trả lại (${STEP_LABEL[st.role]})`,note);log('Trả lại',p.code);save();closeModal();render();toast('Đã trả lại người đề xuất');},'Trả lại');},
  cancel:d=>{const p=P(d.id);askReason(`Hủy ${p.code}`,'Lý do hủy',true,r=>{
      p.cancel={by:S.role,at:nowISO(),reason:r,prev:p.status};p.status='huy';hist(p,'Hủy đề xuất',r);log('Hủy (xóa mềm)',p.code);save();closeModal();render();toast('Đã hủy. Dữ liệu vẫn được lưu.');},'Hủy đề xuất',true);},
  restore:d=>{const p=P(d.id);if(!can.restore(p))return;p.status=p.cancel.prev;hist(p,'Khôi phục',`Khôi phục về trạng thái ${STATUS[p.status]}`);log('Khôi phục',p.code);p.cancel=null;save();render();toast('Đã khôi phục');},
  pay:d=>{const p=P(d.id);const f=p.fields;const pt=f.partnerId&&S.partners.find(x=>x.id===f.partnerId);

      <dt>Người nhận</dt><dd>${pt?esc(pt.name):esc(p.type==='TU'?uname(p.createdBy):f.partnerText)}</dd>${pt?`<dt>Công nợ</dt><dd>Ghi giảm phải trả ${esc(pt.code)}</dd>`:''}</dl>
      <div class="f"><label for="payDate">Ngày chi <span class="req">*</span></label><input id="payDate" name="payDate" type="date" value="${today()}"></div>`,
      `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn pri">Xác nhận chi</button>`,
      fd=>{if(!can.pay(p))return true;const dt=fd.get('payDate');if(!dt){fieldErr('payDate','Chọn ngày chi.');return false;}
        p.payCode=nextCode('PC');
        if(p.type==='TT'){p.status='hoanthanh';if(pt)S.ledger.push({id:uid(),partnerId:pt.id,kind:'thanhtoan',date:dt,due:'',docNo:p.payCode,desc:p.title,amount:f.amount,rate:f.rate||1,method:'Chuyển khoản',alloc:f.invId?[{invId:f.invId,amount:f.amount}]:[],ref:p.code,cancelled:null,by:S.role,at:nowISO()});}
        else p.status='dachi';
        hist(p,`${p.type==='TU'?'Chi tạm ứng':'Lập phiếu chi'} (${p.payCode})`,'');log('Lập phiếu chi',`${p.payCode} ← ${p.code}`);save();closeModal();render();toast(`Đã lập ${p.payCode}`);return true;});},
  settle:d=>{const p=P(d.id);openModal(`Quyết toán ${p.code}`,`<div class="sub">Đã tạm ứng: <b>${money(p.fields.amount)}</b></div>
      <div class="f"><label for="used">Số tiền đã chi có chứng từ <span class="req">*</span></label><input id="used" name="used" type="number" min="0" step="any"></div>
      <div class="f"><label for="snote">Ghi chú</label><input id="snote" name="snote"></div>`,
      `<button type="button" class="btn" data-act="close">Hủy bỏ</button><button type="submit" class="btn pri">Quyết toán</button>`,

        p.settle={used,refund:p.fields.amount-used,at:nowISO()};p.status='hoanthanh';

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(!fn)return;
  if(el.tagName==='BUTTON'&&el.type!=='submit')e.preventDefault();fn(el.dataset,el,e);});
document.addEventListener('submit',e=>{
  if(e.target.id==='pinfo'){e.preventDefault();const p=pById(ui.id);if(!can.ledger()||!p)return;const fd=new FormData(e.target);
    const n=(fd.get('name')||'').trim();if(!n){toast('Tên không được để trống');return;}const tax=(fd.get('tax')||'').trim();if(tax&&!/^\d{10}(-\d{3})?$/.test(tax)){toast('Mã số thuế gồm 10 số (hoặc 10 số-3 số)');return;}
    Object.assign(p,{name:n,tax,addr:(fd.get('addr')||'').trim(),contact:(fd.get('contact')||'').trim(),phone:(fd.get('phone')||'').trim(),email:(fd.get('email')||'').trim(),term:Number(fd.get('term'))||30});
    if(p.kind==='kh')p.limit=Number(fd.get('limit'))||0;log('Sửa thông tin đối tác',p.code);save();render();toast('Đã lưu thông tin');return;}
  if(e.target.id==='scanForm'){e.preventDefault();const v=$('#scanCode').value.trim().toUpperCase();if(!v)return;
    const o=S.prod.orders.find(x=>x.code===v)||S.prod.orders.find(x=>v.startsWith(x.code));
    if(!o){toast(`Không tìm thấy tem ${v}`);return;}go('order',o.id);if(can.report(o))openReport(o);return;}
  if(e.target.id!=='mform')return;e.preventDefault();if(!MODAL||!MODAL.onSubmit)return;
  MODAL.onSubmit(new FormData(e.target),e.submitter);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal();});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){ui.f.q=e.target.value;ui.page=1;const pos=e.target.selectionStart;render();const n=$('#fq');if(n){n.focus();n.setSelectionRange(pos,pos);}}
  if(e.target.id==='eq'){ui.ef.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#eq');if(n){n.focus();n.setSelectionRange(pos,pos);}}
  for(const k of ['dq','diq']){if(e.target.id===k){ui[k]=e.target.value;const pos=e.target.selectionStart;render();const n=$('#'+k);if(n){n.focus();n.setSelectionRange(pos,pos);}}}
  if(['inet','idate'].includes(e.target.id))syncInvoiceForm();
  if(e.target.id==='idue')e.target.dataset.touched='1';
  if(e.target.id==='pamt'||e.target.matches('#pallocs [data-al]'))syncPayForm(false);
  if(e.target.id==='tprog'){const v=$('#tprogv');if(v)v.textContent=e.target.value+'%';}
  if(e.target.id==='pq'){ui.pq=e.target.value;const pos=e.target.selectionStart;render();const n=$('#pq');if(n){n.focus();n.setSelectionRange(pos,pos);}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='ftype'){ui.f.type=e.target.value;ui.page=1;render();}
  if(e.target.id==='fstatus'){ui.f.status=e.target.value;ui.page=1;render();}
  if(e.target.id==='pmonth'){ui.month=e.target.value;render();}
  if(e.target.id==='dsort'){ui.dsort=e.target.value;render();}
  if(e.target.id==='rfrom'||e.target.id==='rto'){ui[e.target.id]=e.target.value;if(ui.rfrom>ui.rto){toast('Từ ngày phải trước đến ngày');return;}render();}
  if(e.target.id==='ipartner'){const pt=pById(e.target.value);if(pt)$('#ivat').value=pt.currency==='VND'?'10':'KCT';$('#idue').dataset.touched='';}
  if(e.target.id==='ipartner'||e.target.id==='ivat')syncInvoiceForm();
  if(e.target.id==='ppartner'){ui.payInv='';syncPayForm(true);}
  if(e.target.id==='partnerId'&&$('#invId')){$('#invId').innerHTML=invOptions(e.target.value,'');}
  if(e.target.id==='invId'&&e.target.value){const o=e.target.selectedOptions[0];if(o&&o.dataset.open&&$('#amount')&&!$('#amount').value)$('#amount').value=o.dataset.open;}
  if(e.target.id==='edept'){ui.ef.dept=e.target.value;render();}
  if(e.target.id==='est'){ui.ef.st=e.target.value;render();}
  if(['attMonth','salMonth','nxtMonth'].includes(e.target.id)){ui[e.target.id]=e.target.value;render();}
  if(e.target.id==='prole'){ui.prole=e.target.value;render();}
  if(e.target.id==='rstage'){const k=STAGES[Number(e.target.value)].k;$$('#rworkers input').forEach(c=>{c.checked=(WORKERS.find(w=>w.id===c.value)||{}).team===k;});
    const o=orderById(ui.id);if(o){$('#rok').value=avail(o,Number(e.target.value));}}
  if(e.target.id==='role'){S.role=e.target.value;save();if(ui.view==='admin'||ui.view==='logs'||ui.view==='debts'||ui.view==='partner'||ui.view==='detail'){}render();toast(`Đang thao tác với vai trò ${USERS[S.role].title}`);}
});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){ui.f={type:'',status:'',q:e.target.value};ui.page=1;go('proposals');}});

load();renderRoleSel();render();
})();
</script>

</body>
</html>
